#cloud-config
# ---------------------------------------------------------------------------
# First-boot dependency bootstrap for the in-VNet Linux worker VM.
#
# This is the ONLY shell script in the repo — deliberately. Everything downstream
# (agent seeding, Teams publish, workflow steps) stays in PowerShell and runs on
# the `pwsh` installed here, which is cross-platform. See docs/operations.md.
#
# Installed:
#   pwsh        - runs scripts/*.ps1 via `az vm run-command` and in workflow steps
#   azure-cli   - control-plane work as the VM managed identity (`az login --identity`),
#                 plus `az acr login` to auth Docker against the PRIVATE registry
#   docker.io   - builds hosted-agent container images on the runner and pushes them to the
#                 private ACR over its private endpoint (ACR Tasks / `az acr build` can't reach a
#                 publicNetworkAccess=Disabled registry, so we build locally instead)
#   docker buildx - the Ubuntu `docker.io` package does NOT include buildx; without it
#                 `docker build` falls back to the legacy builder, which only emits Docker
#                 schema2 layer media types. Foundry's private/locked-down server-side image
#                 build rejects those ("ImageBuildFailed: unsupported MIME type for
#                 compression"), so we install the buildx plugin and build OCI images.
#   python3-*   - the microsoft/ai-agent-evals action pip-installs into a venv
#   git, jq     - actions/checkout and general workflow plumbing
#   yq          - normalizes the YAML agent manifests (agents/<name>/agent.yaml) to JSON at deploy
#                 time (`yq -o=json`) for the REST deploy scripts, and injects per-deploy values
#                 (e.g. the MCP server_url) into the normalized JSON. jq cannot read YAML.
#   zip, unzip  - the CODE-agent deploy zips the publish output with the `zip` CLI so it stores
#                 Unix mode bits (PowerShell Compress-Archive / .NET ZipFile do NOT), keeping
#                 bundled native executables (e.g. the GitHub Copilot CLI) executable after Foundry
#                 extracts the code_configuration zip
#
# The runner bootstrap (bootstrap-github-runner.sh) blocks on `cloud-init status
# --wait`, so the managed Run Command can never race this.
# ---------------------------------------------------------------------------
package_update: true

packages:
  - curl
  - git
  - jq
  - zip
  - unzip
  - python3
  - python3-pip
  - python3-venv
  - libicu-dev
  # Docker Engine from the Ubuntu archive. The runner user is added to the `docker`
  # group in bootstrap-github-runner.sh (it knows RUNNER_USER) BEFORE the runner
  # systemd service starts, so hosted-agent workflow steps can run `docker` without sudo.
  - docker.io

runcmd:
  # Each item is a LIST so cloud-init runs it via execve under bash — NOT the default
  # /bin/sh (dash), which rejects `set -o pipefail`. Keeping bash preserves pipefail on
  # the `curl | bash` az install below.
  # Microsoft package feed (provides powershell; also used by the az install below).
  - - bash
    - -c
    - |
      set -euxo pipefail
      . /etc/os-release
      curl -fsSL "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb" \
        -o /tmp/packages-microsoft-prod.deb
      dpkg -i /tmp/packages-microsoft-prod.deb
      rm -f /tmp/packages-microsoft-prod.deb
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y powershell
  # Azure CLI via the official Microsoft install script.
  - - bash
    - -c
    - |
      set -euxo pipefail
      curl -fsSL https://aka.ms/InstallAzureCLIDeb | bash
  # docker buildx (mobyproject) — the official CLI-plugin binary from GitHub releases (the
  # `docker.io` apt package ships no buildx). Installed system-wide so every user's `docker`
  # finds it. Required so hosted-agent image builds use BuildKit and push OCI media types
  # (the legacy builder only emits Docker schema2, which the private Foundry rejects).
  - - bash
    - -c
    - |
      set -euxo pipefail
      install -d -m 0755 /usr/local/lib/docker/cli-plugins
      curl -fsSL -o /usr/local/lib/docker/cli-plugins/docker-buildx \
        "https://github.com/docker/buildx/releases/download/v0.19.3/buildx-v0.19.3.linux-amd64"
      chmod 0755 /usr/local/lib/docker/cli-plugins/docker-buildx
  # yq (mikefarah) — the standalone Go binary from GitHub releases. Used by the agent deploy
  # workflows to convert the YAML agent manifests to JSON (`yq -o=json`) and to inject per-deploy
  # values into the normalized JSON. Installed system-wide so every workflow step finds it on PATH.
  - - bash
    - -c
    - |
      set -euxo pipefail
      curl -fsSL -o /usr/local/bin/yq \
        "https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64"
      chmod 0755 /usr/local/bin/yq

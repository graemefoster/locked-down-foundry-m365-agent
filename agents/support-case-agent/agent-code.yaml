object: agent.version
name: support-case-agent
description: Hosted support-case agent (code / dotnet_10), served through the model gateway.
# Declares the agent as drivable by Azure Voice Live. Without this flag a Voice Live session
# bound to the agent connects and accepts a turn but returns an empty response (output=0).
metadata:
  voiceLiveCompatible: "true"
# CODE deploy variant of agents/support-case-agent/agent.yaml. Instead of a prebuilt container
# image, Foundry receives the `dotnet publish` output as a zip (code_configuration) and runs it on
# its managed runtime. This path never pulls from an ACR, so it is unaffected by the private-ACR
# provisioning issue that blocks the image (definition.image) variant in the locked-down env.
definition:
  kind: hosted
  protocol_versions:
    - protocol: responses
      version: 2.0.0
  cpu: "1"
  memory: "2Gi"
  code_configuration:
    runtime: dotnet_10
    entry_point: ["dotnet", "support-case-agent.Agent.dll"]
    dependency_resolution: bundled
  environment_variables:
    AZURE_AI_MODEL_DEPLOYMENT_NAME: "gpt-5.4"

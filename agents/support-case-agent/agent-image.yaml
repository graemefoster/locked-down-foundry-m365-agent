object: agent.version
name: support-case-agent
description: Hosted support-case agent (container image), served through the AI gateway.
definition:
  kind: hosted
  container_protocol_versions:
    - protocol: responses
      version: 2.0.0
  cpu: "1"
  memory: 2Gi
  # image is INJECTED at deploy time by deploy-image-agent.ps1 after it builds and pushes the
  # image to the private ACR. Left empty here so the manifest stays environment-agnostic.
  image: ""
  environment_variables:
    AZURE_AI_MODEL_DEPLOYMENT_NAME: model-gateway/gpt-5.4-mini
    OTEL_ENABLE_SENSITIVE_DATA: "true"

object: agent.version
name: support-case-agent
description: Hosted support-case agent (container image), served through the model gateway.
definition:
  kind: hosted
  container_protocol_versions:
    - protocol: responses
      version: 2.0.0
  cpu: "1"
  memory: "2Gi"
  image: "{{agentAcrImage}}"
  environment_variables:
    AZURE_AI_MODEL_DEPLOYMENT_NAME: "model-gateway/gpt-5.4-mini"

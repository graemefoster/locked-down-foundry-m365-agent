object: agent.version
name: teams-agent
description: The agent published to Microsoft Teams / M365, served through the model gateway.
definition:
  kind: hosted
  container_protocol_versions:
    - protocol: invocations
      version: 1.0.0
  cpu: "0.5"
  memory: 1Gi
  image: "{{agentAcrImage}}"
  environment_variables:
    AZURE_AI_MODEL_DEPLOYMENT_NAME: "model-gateway/gpt-5.4-mini"

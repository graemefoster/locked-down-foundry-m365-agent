object: agent.version
name: support-case-agent
description: Hosted support-case agent (code / dotnet_10), served through the model gateway.
metadata:
  voiceLiveCompatible: "true"
definition:
  kind: hosted
  protocol_versions:
    - protocol: responses
      version: 2.0.0
  cpu: "0.5"
  memory: 1Gi
  code_configuration:
    runtime: dotnet_10
    entry_point:
      - dotnet
      - support-case-agent.Agent.dll
    dependency_resolution: bundled
  environment_variables:
    AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5.4
    OTEL_ENABLE_SENSITIVE_DATA: "true"

object: agent.version
name: gfdiag7-36f7d2
description: GFDIAG7-36f7d2 locked-down Foundry M365 diagnostic autopilot (interactive user-token deploy) to verify autopilot identity/creation flow.
publisherName: Graeme Foster
metadata:
  enableVnextExperience: "true"
digital_worker_type: m365
definition:
  kind: hosted
  protocol_versions:
    - protocol: activity
      version: 2.0.0
  cpu: "0.5"
  memory: 1Gi
  code_configuration:
    runtime: python_3_13
    entry_point:
      - python
      - main.py
    dependency_resolution: remote_build
  environment_variables:
    AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
    OTEL_ENABLE_SENSITIVE_DATA: "true"
agent_endpoint:
  protocol_configuration:
    activity:
      enable_m365_public_endpoint: true
  authorization_schemes:
    - type: BotServiceRbac

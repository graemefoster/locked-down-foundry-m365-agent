[project]
name = "agent"
version = "0.1.0"
description = "Minimal Microsoft 365 agent that replies to Teams messages with 'Hello, world!'."
authors = [{ name = "Microsoft", email = "support@microsoft.com" }]
requires-python = ">=3.11"
dependencies = [
    "microsoft-agents-hosting-aiohttp==1.8.0",
    "microsoft-agents-hosting-core==1.8.0",
    "microsoft-agents-authentication-msal==1.8.0",
    "microsoft-agents-activity==1.8.0",
    "microsoft-opentelemetry[hosting]==1.3.9",
    "opentelemetry-instrumentation-aiohttp-client==0.65b0",
    "aiohttp>=3.14.3,<4",
    "azure-ai-projects==2.7.0",
    "azure-identity==1.26.0",
    "httpx==0.28.1",
    "openai==3.19.2",
]

[project.scripts]
agent = "agent.__main__:main"

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.32.0'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.13'
name: advanced-autopilot-agent
infra:
  provider: microsoft.foundry
services:
  ai-project:
    host: azure.ai.project
    endpoint: ${AZURE_AI_PROJECT_ENDPOINT}
  advanced-autopilot-agent:
    host: azure.ai.agent
    project: .
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    uses:
      - ai-project
    kind: hosted
    name: advanced-autopilot-agent
    displayName: advanced-autopilot-agent
    description: Advanced Microsoft 365 Autopilot agent using the Agent 365 MCP tool bundle.
    metadata:
      enableVnextExperience: "true"
    protocols:
      - protocol: activity
        version: 1.0.0
    agentEndpoint:
      protocols:
        - activity
      authorizationSchemes:
        - type: BotServiceRbac
    activity:
      useCase: digital_worker
      publish:
        publishScope: tenant
        appVersion: 1.0.1
        agentDisplayName: advanced-autopilot-agent
        canRespondWithoutMention: true
        shortDescription: Advanced Autopilot digital worker adapted from the Foundry Autopilot sample.
        fullDescription: Advanced Autopilot digital worker using the Foundry Responses API and Microsoft 365 MCP tools.
        developerName: Azure Developer
        developerWebsiteUrl: https://azure.microsoft.com
        privacyUrl: https://privacy.microsoft.com
        termsOfUseUrl: https://www.microsoft.com/legal/terms-of-use
        agenticUserTemplate:
          id: digitalWorkerTemplate
          file: agenticUserTemplateManifest.json
          schemaVersion: 0.1.0-preview
          communicationProtocol: activityProtocol
    env:
      ModelDeployment: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      FOUNDRY_PROJECT_ENDPOINT: ${AZURE_AI_PROJECT_ENDPOINT}
      MCP_PLATFORM_ENDPOINT: https://agent365.svc.cloud.microsoft
      CONNECTIONS__SERVICE_CONNECTION__SETTINGS__AUTHTYPE: IdentityProxyManager
      CONNECTIONS__SERVICE_CONNECTION__SETTINGS__SCOPES__0: 5a807f24-c9de-44ee-a3a7-329e88a00ffc/.default
      CONNECTIONSMAP__0__SERVICEURL: "*"
      CONNECTIONSMAP__0__CONNECTION: SERVICE_CONNECTION
      AGENTAPPLICATION__STARTTYPINGTIMER: "false"
      AGENTAPPLICATION__REMOVERECIPIENTMENTION: "false"
      AGENTAPPLICATION__NORMALIZEMENTIONS: "false"
      AGENTAPPLICATION__USERAUTHORIZATION__AUTOSIGNIN: "false"
      AGENTAPPLICATION__USERAUTHORIZATION__HANDLERS__AGENTIC__TYPE: AgenticUserAuthorization
      AGENTAPPLICATION__USERAUTHORIZATION__HANDLERS__AGENTIC__SETTINGS__SCOPES: 5a807f24-c9de-44ee-a3a7-329e88a00ffc/.default
    container:
      resources:
        cpu: '2'
        memory: 4Gi

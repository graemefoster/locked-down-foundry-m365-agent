# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.32.0'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.13'
name: advanced-autopilot-agent
infra:
  provider: microsoft.foundry
services:
  ai-project:
    host: azure.ai.project
    endpoint: https://aiservicesfrce.services.ai.azure.com/api/projects/project-frce
  advanced-autopilot-agent:
    host: azure.ai.agent
    project: ./hello_world_a365_agent
    language: docker
    docker:
      path: Dockerfile
      remoteBuild: false
    uses:
      - ai-project
    kind: hosted
    name: advanced-autopilot-agent
    displayName: advanced-autopilot-agent
    description: Advanced Microsoft 365 Autopilot agent using the Agent 365 MCP tool bundle.
    metadata:
      enableVnextExperience: "true"
    protocols:
      - protocol: activity
        version: 2.0.0
    agentEndpoint:
      protocols:
        - activity
      authorizationSchemes:
        - type: BotServiceRbac
    env:
      ModelDeployment: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      FOUNDRY_PROJECT_ENDPOINT: ${AZURE_AI_PROJECT_ENDPOINT}
    container:
      resources:
        cpu: '2'
        memory: 4Gi

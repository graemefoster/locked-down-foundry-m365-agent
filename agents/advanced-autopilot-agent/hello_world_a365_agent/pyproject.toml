[project]
name = "hello-world-a365-agent"
version = "0.1.0"
description = "Foundry A365 hello-world digital worker agent (Python)."
authors = [{ name = "Microsoft", email = "support@microsoft.com" }]
requires-python = ">=3.11"
dependencies = [
    "microsoft-agents-hosting-aiohttp==1.7.0",
    "microsoft-agents-hosting-core==1.7.0",
    "microsoft-agents-authentication-msal==1.7.0",
    "microsoft-agents-activity==1.7.0",
    "microsoft-agents-a365-notifications==1.0.0",
    "azure-ai-projects==2.4.0",
    "openai==3.7.0",
    "azure-core-tracing-opentelemetry==1.0.0b13",
    "azure-identity==1.25.3",
    "azure-keyvault-secrets==4.11.2",
    "azure-monitor-opentelemetry==1.8.9",
    "opentelemetry-api==1.43.0",
    "opentelemetry-sdk==1.43.0",
    "opentelemetry-instrumentation-httpx==0.64b0",
    "aiohttp==3.14.3",
    "httpx==0.28.1",
    "python-dotenv==1.2.3",
    "pydantic==2.13.5",
    "typing-extensions==4.16.0",
]

[project.scripts]
hello-world-a365-agent = "hello_world_a365_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hello_world_a365_agent"]

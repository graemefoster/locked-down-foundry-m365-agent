object: agent.version
name: autopiolot-agent
description: Autopilot agent that responds to Teams messages, and can call work-iq.
definition:
  kind: hosted
  protocol_versions:
    - protocol: activity
      version: 2.0.0
  agentEndpoint:
    protocols:
      - activity
    authorizationSchemes:
      - type: BotServiceRbac
  cpu: "0.5"
  memory: 1Gi
  code_configuration:
    runtime: dotnet_10
    entry_point:
      - dotnet
      - support-case-agent.Agent.dll
    dependency_resolution: bundled
  environment_variables:
    AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5.4
    OTEL_ENABLE_SENSITIVE_DATA: "true"
    

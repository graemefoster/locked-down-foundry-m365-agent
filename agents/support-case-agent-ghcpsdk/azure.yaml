# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.32.0'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.13'
name: support-case-agent-ghcpsdk
services:
  ai-project:
    host: azure.ai.project
    endpoint: ${AZURE_AI_PROJECT_ENDPOINT}
  support-case-agent-ghcpsdk:
    host: azure.ai.agent
    project: ./src/agent
    language: csharp
    codeConfiguration:
      runtime: dotnet_10
      entryPoint: support-case-agent-ghcpsdk.Agent.dll
      dependencyResolution: bundled
    uses:
      - ai-project
    kind: hosted
    name: support-case-agent-ghcpsdk
    description: General IT support agent powered by the GitHub Copilot SDK.
    protocols:
      - protocol: invocations
        version: 1.0.0
    env:
      MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      FOUNDRY_PROJECT_ENDPOINT: ${AZURE_AI_PROJECT_ENDPOINT}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi

# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml

kind: hosted
name: copilot-file-processing-agent
description: GitHub Copilot SDK hosted agent using BYOK and the Invocations protocol
metadata:
  tags:
    - ghcp-sdk
    - hosted-agent
    - invocations
protocols:
  - protocol: invocations
    version: 1.0.0
environment_variables:
  - name: MODEL_DEPLOYMENT_NAME
    value: gpt-5-mini
resources:
  cpu: "1"
  memory: 2Gi

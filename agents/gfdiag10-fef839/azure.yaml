# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.32.0'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.13'
name: gfdiag10-fef839
infra:
  provider: microsoft.foundry
services:
  ai-project:
    host: azure.ai.project
    endpoint: https://aiservicesfrce.services.ai.azure.com/api/projects/project-frce
  gfdiag10-fef839:
    host: azure.ai.agent
    project: ../grf-2026-autopilot-agent/simple-autopilot-agent
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: gfdiag10-fef839
    description: GFDIAG10 Microsoft 365 diagnostic Autopilot agent.
    metadata:
      enableVnextExperience: "true"
    protocols:
      - protocol: activity
        version: 2.0.0
    agentEndpoint:
      protocols:
        - activity
      authorizationSchemes:
        - type: BotServiceRbac
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      OTEL_ENABLE_SENSITIVE_DATA: "true"
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi

object: agent.version
name: workflow-support-agent
description: Hosted workflow-support-agent (code / dotnet_10), served through the model gateway.
# CODE deploy variant. Like agents/support-case-agent/agent-code.yaml, Foundry receives the
# `dotnet publish` output as a zip (code_configuration) and runs it on its managed dotnet runtime —
# no private-ACR pull. This agent hosts a DECLARATIVE workflow (workflow.yaml) instead of a single
# prompt; at startup the app builds the `workflow_support_reasoner` helper IN-PROCESS (custom
# ResponseAgentProvider) that the workflow's InvokeAzureAgent steps call - no extra persisted agent.
definition:
  kind: hosted
  protocol_versions:
    - protocol: responses
      version: 2.0.0
  cpu: "1"
  memory: "2Gi"
  code_configuration:
    runtime: dotnet_10
    entry_point: ["dotnet", "workflow-support-agent.Agent.dll"]
    dependency_resolution: bundled
  environment_variables:
    AZURE_AI_MODEL_DEPLOYMENT_NAME: "model-gateway/gpt-5.4-mini"

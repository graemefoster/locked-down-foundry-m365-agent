object: agent.version
name: teams-agent
description: The agent published to Microsoft Teams / M365, served through the model gateway.
definition:
  kind: prompt
  # Gateway model reference: '<apim-connection-name>/<exposed-model-name>'. The connection name
  # ('model-gateway') is fixed by the template (modelGatewayConnectionName).
  model: model-gateway/gpt-5.4-mini
  instructions: You are a helpful AI assistant available in Microsoft Teams, served through the enterprise model gateway. Answer questions clearly and concisely.
  tools:
    - type: mcp
      server_label: testweathermcpserver
      # server_url is intentionally omitted here and INJECTED at deploy time by the reusable
      # .github/workflows/deploy-agent.yml (from the MCP_SERVER_URL repo variable / dispatch
      # input), so this manifest can be promoted across environments unchanged. The
      # Foundry MCP tool schema still requires exactly one of server_url/connector_id/tunnel_id
      # for the endpoint, so it cannot be left out of the deployed definition; project_connection_id
      # below supplies auth (AgenticIdentityToken) via the per-env 'testweathermcpserver' connection.
      project_connection_id: testweathermcpserver
      # Auto-approve MCP tool calls. MCP tools default to require_approval "always",
      # which pauses the run on an mcp_approval_request. The nightly eval samples the
      # agent non-interactively (nothing answers the approval), so those turns end as a
      # dangling tool-call with no final text -> the agents-category evaluators
      # (intent_resolution, task_adherence) fail with "Response string cannot be empty".
      # "never" lets the tool execute so the model produces a final answer to evaluate.
      require_approval: "never"

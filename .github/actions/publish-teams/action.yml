name: Publish Foundry agent to Teams / M365
description: >-
  Publish a single already-deployed Foundry agent to Microsoft Teams / M365 from the in-VNet
  self-hosted runner. It reads the agent identity, creates an Azure Bot Service, enables the
  activity protocol and submits the app to the Microsoft 365 catalog (scripts/publish-teams-runner.ps1).

  Runs entirely on the VM as its managed identity, EXCEPT the Microsoft 365 publish call, which
  performs an on-behalf-of exchange and rejects app-only / MI tokens (HTTP 502). This action
  therefore acquires a DELEGATED USER token via the interactive device-code flow: it prints a code
  + URL and blocks until you complete sign-in. Nothing secret is logged (the device code alone is
  useless; the token is masked). The repo must already be checked out (actions/checkout) so this
  action and scripts/publish-teams-runner.ps1 are on disk.

inputs:
  foundry-endpoint:
    description: Foundry project endpoint (private).
    required: true
  agent-name:
    description: The agent name to publish (one Azure Bot Service).
    required: true
  resource-group:
    description: Resource group that holds the Bot Service and the VM.
    required: true
  yarp-fqdn:
    description: Public YARP FQDN — the Azure Bot Service messaging endpoint host.
    required: true
  tenant-id:
    description: Entra tenant for the single-tenant bot registration and the device-code sign-in.
    required: true
  bot-name:
    description: Base Azure Bot Service name; each bot is '<bot-name>-<agentName>'.
    required: true
  name-prefix:
    description: Prefix onto each published display name (the env's unique suffix). Optional.
    required: false
    default: ""
  log-analytics-id:
    description: Log Analytics workspace resource ID for bot diagnostics. Optional.
    required: false
    default: ""
  publish-scope:
    description: Microsoft 365 publish scope ('Shared' or 'Tenant'). Defaults to 'Shared' when blank.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Verify Azure CLI is available
      shell: pwsh
      run: |
        # az is installed by cloud-init on the Linux worker VM.
        if (-not (Get-Command az -ErrorAction SilentlyContinue)) {
          throw "Azure CLI not found on the VM. Re-run 'azd provision' so cloud-init installs it."
        }
        az version

    # The Microsoft 365 publish step does an on-behalf-of submission and rejects an app-only /
    # managed-identity token (HTTP 502). Acquire a DELEGATED USER token interactively via the
    # device-code flow: the step prints a code + URL and blocks until you complete sign-in.
    # Nothing secret is logged (the device code alone is useless; the token is masked).
    - name: Acquire a delegated user token (device code)
      shell: pwsh
      env:
        TENANT_ID: ${{ inputs.tenant-id }}
      run: |
        Write-Host '>>> A device-code sign-in is required for the Microsoft 365 publish step.'
        Write-Host '>>> Open the URL below and enter the code, then this job will continue.'
        az login --use-device-code --tenant $env:TENANT_ID --output none
        if ($LASTEXITCODE -ne 0) { throw 'Device-code sign-in failed.' }
        $userToken = az account get-access-token --resource https://ai.azure.com --query accessToken -o tsv
        if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($userToken)) {
          throw 'Failed to acquire a user access token after device-code sign-in.'
        }
        Write-Host "::add-mask::$userToken"
        "PUBLISH_USER_TOKEN=$userToken" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        Write-Host 'Delegated user token acquired for the publish step.'

    - name: Sign in with the VM managed identity
      shell: pwsh
      # Restore the MI as the active az context so bot-service ARM creation and the Foundry
      # read run as the VM managed identity (which holds the required RBAC).
      run: az login --identity --output none

    - name: Publish agent to Teams / M365 (in-VNet, via VM managed identity)
      shell: pwsh
      env:
        FOUNDRY_ENDPOINT: ${{ inputs.foundry-endpoint }}
        AGENT_NAME:       ${{ inputs.agent-name }}
        RESOURCE_GROUP:   ${{ inputs.resource-group }}
        YARP_FQDN:        ${{ inputs.yarp-fqdn }}
        TENANT_ID:        ${{ inputs.tenant-id }}
        BOT_NAME:         ${{ inputs.bot-name }}
        NAME_PREFIX:      ${{ inputs.name-prefix }}
        LOG_ANALYTICS_ID: ${{ inputs.log-analytics-id }}
        PUBLISH_SCOPE:    ${{ inputs.publish-scope }}
      run: |
        foreach ($v in 'FOUNDRY_ENDPOINT','AGENT_NAME','RESOURCE_GROUP','YARP_FQDN','TENANT_ID','BOT_NAME') {
          if ([string]::IsNullOrWhiteSpace((Get-Item "env:$v" -ErrorAction SilentlyContinue).Value)) {
            throw "Publish requires '$v'. Set the corresponding repo variables (AZURE_RESOURCE_GROUP, TEAMS_YARP_FQDN, TEAMS_TENANT_ID, TEAMS_BOT_NAME, ...) from 'azd env get-values', or pass the matching action input."
          }
        }
        $scope = if ([string]::IsNullOrWhiteSpace($env:PUBLISH_SCOPE)) { 'Shared' } else { $env:PUBLISH_SCOPE }
        ./scripts/publish-teams-runner.ps1 `
          -FoundryProjectEndpoint   $env:FOUNDRY_ENDPOINT `
          -ResourceGroup            $env:RESOURCE_GROUP `
          -AgentName                $env:AGENT_NAME `
          -YarpFqdn                 $env:YARP_FQDN `
          -TenantId                 $env:TENANT_ID `
          -BotName                  $env:BOT_NAME `
          -NamePrefix               $env:NAME_PREFIX `
          -LogAnalyticsWorkspaceId  $env:LOG_ANALYTICS_ID `
          -PublishScope             $scope `
          -PublishAccessToken       $env:PUBLISH_USER_TOKEN

name: Deploy teams-agent (VNet self-hosted)

# Thin caller for the agent published to Microsoft Teams / M365 (agents/teams-agent/agent.yaml),
# served through the enterprise model gateway (APIM). All the work lives in the reusable
# .github/workflows/deploy-agent.yml — this file only targets ONE agent, supplies its
# per-environment gateway model, and (by default) publishes it to Teams. The Teams publish is a
# separate job gated by the `vnet-deploy` environment for manual approval.
on:
  workflow_dispatch:
    inputs:
      foundryProjectEndpoint:
        description: "Foundry project endpoint (defaults to repo variable AZURE_AI_PROJECT_ENDPOINT)"
        required: false
        default: ""
      publishToTeams:
        description: "After deploy, publish this agent to Teams / M365 (requires manual approval)"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-agent.yml
    with:
      manifest-path: agents/teams-agent/agent.yaml
      foundry-endpoint: ${{ inputs.foundryProjectEndpoint }}
      publish-to-teams: ${{ inputs.publishToTeams }}

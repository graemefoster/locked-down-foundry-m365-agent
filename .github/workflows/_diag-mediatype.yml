name: (diag) plain docker push media type

# TEMPORARY diagnostic — does a STANDARD `docker build` + `docker push` on this runner
# (Docker 29 + containerd image store, no buildx) produce OCI or Docker schema2 layer
# media types? Builds a tiny scratch image, pushes to the private ACR, then reads the
# STORED manifest media types back from the registry v2 API. Delete after use.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: [self-hosted, vnet, foundry-private]
    env:
      ACR_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
    steps:
      - name: Plain build+push, then inspect stored media type
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ACR_NAME:-}" ]; then echo "ACR_NAME repo var not set"; exit 1; fi

          az login --identity --output none
          loginServer=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          echo "loginServer=$loginServer"
          az acr login --name "$ACR_NAME" --output none

          work=$(mktemp -d)
          echo "hello-oci-test $(date -u +%s)" > "$work/test.txt"
          cat > "$work/Dockerfile" <<'EOF'
          FROM scratch
          COPY test.txt /test.txt
          EOF

          repo="mediatype-probe"
          tag="t$(date -u +%s)"
          imageRef="$loginServer/$repo:$tag"

          echo "=== docker build (standard) ==="
          docker build --tag "$imageRef" --file "$work/Dockerfile" "$work"
          echo "=== docker push (standard) ==="
          docker push "$imageRef"

          echo "=== read STORED manifest media types from the registry v2 API ==="
          token=$(az acr login --name "$ACR_NAME" --expose-token --query accessToken -o tsv)
          # Accept both so the registry returns whatever it actually STORED (no conversion).
          hdrfile="$work/hdr.txt"; body="$work/manifest.json"
          curl -sS -D "$hdrfile" -o "$body" \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://$loginServer/v2/$repo/manifests/$tag"

          echo "--- HTTP Content-Type of stored manifest ---"
          grep -i '^content-type:' "$hdrfile" || true
          echo "--- manifest.mediaType ---"
          jq -r '.mediaType // "(none)"' "$body"
          echo "--- config.mediaType ---"
          jq -r '.config.mediaType // "(n/a - index?)"' "$body"
          echo "--- layers[].mediaType ---"
          jq -r '(.layers // [])[].mediaType' "$body" || true
          echo "--- (if index) manifests[].mediaType ---"
          jq -r '(.manifests // [])[].mediaType' "$body" || true

          echo
          echo "=== VERDICT ==="
          cfg=$(jq -r '.config.mediaType // ""' "$body")
          lyr=$(jq -r '((.layers // [])[0].mediaType) // ""' "$body")
          echo "config=$cfg"
          echo "layer0=$lyr"
          case "$lyr" in
            application/vnd.oci.image.layer.v1.tar+gzip) echo ">>> OCI media types: standard docker push IS sufficient." ;;
            application/vnd.docker.image.rootfs.diff.tar.gzip) echo ">>> DOCKER schema2 media types: standard push is NOT sufficient (need buildx/skopeo/OCI conversion)." ;;
            "") echo ">>> Got an index/list at top level; inspect manifests[] above." ;;
            *) echo ">>> Unexpected layer media type: $lyr" ;;
          esac

          echo "=== cleanup: delete probe tag ==="
          az acr repository delete --name "$ACR_NAME" --image "$repo:$tag" --yes 2>/dev/null || echo "(probe cleanup best-effort)"
          rm -rf "$work"

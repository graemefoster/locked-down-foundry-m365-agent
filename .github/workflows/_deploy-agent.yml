name: "Internal: Deploy prompt agent"

on:
  workflow_call:
    inputs:
      agent-directory:
        description: Directory containing the prompt agent's agent.yaml.
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'graemefoster/locked-down-foundry-m365-agent'
    runs-on: [self-hosted, vnet, foundry-private]
    steps:
      - uses: actions/checkout@v5

      - name: Sign in with the VM managed identity
        shell: pwsh
        run: az login --identity --output none

      - name: Deploy and serve the prompt agent
        shell: pwsh
        run: |
          ./scripts/deploy-agent.ps1 `
            -AgentDirectory "${{ inputs.agent-directory }}" `
            -FoundryProjectEndpoint "${{ vars.AZURE_AI_PROJECT_ENDPOINT }}" `
            -McpGatewayUrl "${{ vars.MCP_GATEWAY_URL || vars.MCP_SERVER_URL }}" `
            -McpConfigPath mcp/mcp.json

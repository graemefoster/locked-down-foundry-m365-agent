name: Deploy prompt agent

on:
  workflow_call:
    inputs:
      agent-json:
        description: Path to the prompt agent JSON file.
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'graemefoster/locked-down-foundry-m365-agent'
    runs-on: [self-hosted, vnet, foundry-private]
    steps:
      - uses: actions/checkout@v5

      - name: Sign in with the VM managed identity
        shell: pwsh
        run: az login --identity --output none

      - name: Deploy and publish the prompt agent
        shell: pwsh
        run: |
          ./scripts/deploy-prompt-agent.ps1 `
            -AgentJsonPath "${{ inputs.agent-json }}" `
            -FoundryProjectEndpoint "${{ vars.AZURE_AI_PROJECT_ENDPOINT }}" `
            -McpServerUrl "${{ vars.MCP_SERVER_URL }}"

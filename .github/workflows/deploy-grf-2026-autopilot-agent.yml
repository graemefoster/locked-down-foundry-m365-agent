name: Deploy grf-2026-autopilot-agent
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-lifecycle
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-code-agent.yml
    with:
      agent-directory: agents/grf-2026-autopilot-agent
      source-directory: simple-autopilot-agent
      grant-agent-project-access: true

  governance:
    needs: deploy
    uses: ./.github/workflows/deploy-agent-network.yml

  publish:
    needs: governance
    uses: ./.github/workflows/publish-teams.yml
    with:
      agent-directory: agents/grf-2026-autopilot-agent

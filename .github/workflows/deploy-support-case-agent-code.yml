name: Deploy support-case-agent
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-code-agent.yml
    with:
      agent-manifest: agents/support-case-agent/agent.yaml
      build-context: agents/support-case-agent/support-case-agent.Agent
      entry-dll: support-case-agent.Agent.dll

name: Nightly eval — test-agent-one (VNet self-hosted)

# ---------------------------------------------------------------------------
# Offline evaluation of the Foundry agent (agents/test-agent-one/agent.yaml)
# using the Microsoft "Azure AI Agent Evaluation" GitHub Action:
#   https://learn.microsoft.com/azure/foundry/how-to/evaluation-github-action
#   https://github.com/microsoft/ai-agent-evals
#
# The action invokes the agent with the queries in agents/test-agent-one/eval-data.json,
# runs the listed evaluators, and writes a scored report to the run summary.
#
# Why self-hosted / in-VNet (same reasoning as deploy-test-agent-one.yml):
#   The Foundry project endpoint is PRIVATE, so the eval action can only reach it from
#   the in-VNet self-hosted runner. Auth is free there: the action uses
#   DefaultAzureCredential, which picks up the VM's SYSTEM-ASSIGNED managed identity via
#   IMDS — no `azure/login` / OIDC and no id-token permission needed.
#
# Runner prerequisites (installed by infra/.../bootstrap-github-runner.ps1):
#   * Git for Windows — the action's steps declare `shell: bash`, which on Windows
#     resolves to Git Bash. Windows Server ships no Git, so the bootstrap installs it.
#   * Python is provided at run time by actions/setup-python (the VM subnet has
#     unrestricted egress, so the download and `pip install` succeed).
#
# ⚠️ Known limitation — version-over-version comparison is DISABLED by default here:
#   microsoft/ai-agent-evals' comparison step calls the Foundry "insights.generate"
#   (cluster-analysis) API, which is NOT supported in Private BYO-network workspaces
#   (this project is one). Passing two agent versions makes action.py raise
#   "(UserError) ... Cluster analysis is not supported in Private BYO enabled workspaces."
#   AFTER all per-version scoring succeeds, failing the whole run. So by default we
#   evaluate ONLY the latest version (single-agent) — a full scored report still posts.
#   To force a comparison anyway (e.g. against a non-private workspace, or once the
#   platform supports it), pass the `agentIds`/`baselineAgentId` inputs explicitly.
#   Tracked as a platform missing-feature. See NETWORKING.md → "Known limitation:
#   version-over-version eval comparison".
#
# workflow_dispatch + a repository guard keep fork code off the VM. The nightly
# schedule is UTC; 16:00 UTC ≈ midnight in UTC+08. (Docs advise NOT evaluating on
# every commit, to keep model/eval costs down.)
# ---------------------------------------------------------------------------
on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      foundryProjectEndpoint:
        description: "Foundry project endpoint (defaults to repo variable AZURE_AI_PROJECT_ENDPOINT)"
        required: false
        default: ""
      deploymentName:
        description: "Model deployment used for evaluation (defaults to repo variable AZURE_AI_MODEL_DEPLOYMENT_NAME)"
        required: false
        default: ""
      agentIds:
        description: "Agent id(s) to evaluate as name:version, comma-separated. Default: latest version only (single-agent). Pass two ids to force a comparison (unsupported in Private BYO workspaces — see header)."
        required: false
        default: ""
      baselineAgentId:
        description: "Baseline agent id (name:version) for an explicit comparison run (only used when agentIds lists two versions)."
        required: false
        default: ""
      dataPath:
        description: "Path to the eval data file"
        required: false
        default: "agents/test-agent-one/eval-data.json"
      apiVersion:
        description: "Agents REST API version (used only to resolve the latest agent version)"
        required: false
        default: "2025-11-15-preview"

permissions:
  contents: read

env:
  MANIFEST_PATH: agents/test-agent-one/agent.yaml

jobs:
  # Single job on the PRIVATE endpoint runner: resolve config, then run the eval action.
  evaluate:
    if: github.repository == 'graemefoster/locked-down-foundry-m365-agent'
    runs-on: [self-hosted, vnet, foundry-private]
    steps:
      - uses: actions/checkout@v5

      # Resolve endpoint, deployment name, data path, and the agent id(s) to evaluate.
      # When agentIds is not supplied we look up the manifest agent's versions (via the same
      # IMDS + Agents REST helpers the deploy path uses) and evaluate ONLY the latest one.
      # We intentionally do NOT auto-compare against the previous version: the comparison step
      # is unsupported in this Private BYO workspace (see header). A comparison run is opt-in
      # via the agentIds/baselineAgentId inputs.
      - name: Resolve evaluation inputs
        id: cfg
        shell: powershell
        env:
          INPUT_ENDPOINT:   ${{ inputs.foundryProjectEndpoint }}
          VAR_ENDPOINT:     ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
          INPUT_DEPLOYMENT: ${{ inputs.deploymentName }}
          VAR_DEPLOYMENT:   ${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME }}
          INPUT_AGENT_IDS:  ${{ inputs.agentIds }}
          INPUT_BASELINE:   ${{ inputs.baselineAgentId }}
          INPUT_DATA_PATH:  ${{ inputs.dataPath }}
          API_VERSION:      ${{ inputs.apiVersion }}
        run: |
          $ErrorActionPreference = 'Stop'

          $endpoint = if (-not [string]::IsNullOrWhiteSpace($env:INPUT_ENDPOINT)) { $env:INPUT_ENDPOINT } else { $env:VAR_ENDPOINT }
          if ([string]::IsNullOrWhiteSpace($endpoint)) {
            throw "Set repo variable AZURE_AI_PROJECT_ENDPOINT, or pass foundryProjectEndpoint as a dispatch input."
          }
          $endpoint = $endpoint.TrimEnd('/')

          $deployment = if (-not [string]::IsNullOrWhiteSpace($env:INPUT_DEPLOYMENT)) { $env:INPUT_DEPLOYMENT } else { $env:VAR_DEPLOYMENT }
          if ([string]::IsNullOrWhiteSpace($deployment)) {
            throw "Set repo variable AZURE_AI_MODEL_DEPLOYMENT_NAME, or pass deploymentName as a dispatch input."
          }

          $dataPath = if (-not [string]::IsNullOrWhiteSpace($env:INPUT_DATA_PATH)) { $env:INPUT_DATA_PATH } else { 'agents/test-agent-one/eval-data.json' }
          if (-not (Test-Path -LiteralPath $dataPath)) { throw "Eval data file not found: $dataPath" }

          $apiVersion = if (-not [string]::IsNullOrWhiteSpace($env:API_VERSION)) { $env:API_VERSION } else { '2025-11-15-preview' }

          $agentIds = $env:INPUT_AGENT_IDS
          $baseline = $env:INPUT_BASELINE
          if ([string]::IsNullOrWhiteSpace($agentIds)) {
            # Read the agent name from the manifest (no yq on the VM — simple regex parse).
            $manifest = $env:MANIFEST_PATH
            if (-not (Test-Path -LiteralPath $manifest)) { throw "Manifest not found: $manifest" }
            $nameLine = Select-String -LiteralPath $manifest -Pattern '^\s*name:\s*(.+?)\s*$' | Select-Object -First 1
            if (-not $nameLine) { throw "Manifest '$manifest' has no 'name'." }
            $agentName = $nameLine.Matches[0].Groups[1].Value.Trim().Trim('"').Trim("'")

            . (Join-Path $PWD 'scripts/foundry-agent-common.ps1')
            $token = Get-FoundryToken
            $versions = @(Get-AgentVersionsDescending -Token $token -Endpoint $endpoint -ApiVersion $apiVersion -Name $agentName)
            if ($versions.Count -eq 0) {
              throw "No versions found for agent '$agentName' at $endpoint. Deploy it first (deploy-test-agent-one.yml)."
            }
            $latest = $versions[0]
            # Default: evaluate ONLY the latest version (single-agent). We deliberately do NOT
            # auto-build a version-over-version comparison: microsoft/ai-agent-evals' comparison
            # relies on the Foundry "insights.generate" cluster-analysis API, which is NOT
            # supported in Private BYO-network workspaces (this project) and fails the whole run
            # AFTER scoring. To force a comparison anyway, pass the agentIds/baselineAgentId inputs.
            $agentIds = "${agentName}:${latest}"
            if ($versions.Count -ge 2) {
              Write-Host "Found $($versions.Count) versions of '$agentName'; evaluating only the latest ($latest). Version-over-version comparison is unsupported in this Private BYO workspace — pass 'agentIds' to override."
            }
            else {
              Write-Host "Only one version of '$agentName' exists; running a single-agent evaluation."
            }
          }

          Write-Host "Endpoint:    $endpoint"
          Write-Host "Deployment:  $deployment"
          Write-Host "Agent id(s): $agentIds"
          Write-Host "Baseline:    $(if ([string]::IsNullOrWhiteSpace($baseline)) { '(none)' } else { $baseline })"
          Write-Host "Data path:   $dataPath"

          "endpoint=$endpoint"     | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "deployment=$deployment" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "agent-ids=$agentIds"    | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "baseline=$baseline"     | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "data-path=$dataPath"    | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # We run the upstream microsoft/ai-agent-evals code ourselves rather than via
      # `uses: microsoft/ai-agent-evals@v3-beta`. Reason: that composite action declares its
      # steps with `shell: bash` and passes ${{ github.action_path }} UNQUOTED to pip/python.
      # On this Windows runner the path is backslash-separated (C:\actions-runner\...), and
      # bash strips the backslashes -> "C:actions-runner..." -> the action fails. Linux runners
      # avoid this (forward-slash paths), but the Foundry endpoint is private so we must stay
      # on the in-VNet Windows runner. Checking the action out to a sub-directory and invoking
      # it from there with RELATIVE paths (`pip install .`, `python action.py`) means no Windows
      # path is ever tokenised by bash. Pinned to the same v3-beta ref, so behaviour matches.
      - name: Check out the evaluation action
        uses: actions/checkout@v5
        with:
          repository: microsoft/ai-agent-evals
          ref: v3-beta
          path: .ai-agent-evals

      # Provides python 3.10 (found in the runner tool cache, pre-seeded by the bootstrap).
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install evaluation dependencies
        shell: bash
        working-directory: .ai-agent-evals
        run: |
          python -m pip install --upgrade pip
          pip install .

      # Runs the agent against the dataset and posts a scored report to the run summary.
      # DefaultAzureCredential authenticates as the VM's system-assigned managed identity.
      # By default a single version is evaluated (see header). If two versions are passed
      # explicitly, action.py also attempts a pairwise comparison — which will fail in this
      # Private BYO workspace because the underlying cluster-analysis API is unsupported.
      # These env vars mirror exactly what microsoft/ai-agent-evals' action.yml sets for action.py.
      - name: Run agent evaluation
        shell: bash
        working-directory: .ai-agent-evals
        run: python action.py
        env:
          AZURE_AI_PROJECT_ENDPOINT: ${{ steps.cfg.outputs.endpoint }}
          DEPLOYMENT_NAME: ${{ steps.cfg.outputs.deployment }}
          API_VERSION: ""
          DATA_PATH: ${{ github.workspace }}/${{ steps.cfg.outputs.data-path }}
          AGENT_IDS: ${{ steps.cfg.outputs.agent-ids }}
          BASELINE_AGENT_ID: ${{ steps.cfg.outputs.baseline }}

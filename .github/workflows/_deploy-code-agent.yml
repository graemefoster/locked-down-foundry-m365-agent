name: "Internal: Deploy source-zip agent"

on:
  workflow_call:
    inputs:
      agent-directory:
        description: Directory containing the hosted agent's agent.yaml.
        type: string
        required: true
      source-directory:
        description: Source directory relative to the agent directory.
        type: string
        required: false
        default: ''
      grant-agent-project-access:
        description: Grant the runtime agent identity Foundry User on the project before serving it.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'graemefoster/locked-down-foundry-m365-agent'
    runs-on: [self-hosted, vnet, foundry-private]
    steps:
      - uses: actions/checkout@v5

      - name: Sign in with the VM managed identity
        shell: pwsh
        run: |
          az login --identity --output none
          if ($LASTEXITCODE -ne 0) { throw "Managed-identity sign-in failed." }
          az account set --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          if ($LASTEXITCODE -ne 0) { throw "Could not select the deployment subscription." }

      - name: Package and deploy the source agent
        shell: pwsh
        run: |
          ./scripts/deploy-agent.ps1 `
            -AgentDirectory "${{ inputs.agent-directory }}" `
            -SourceDirectory "${{ inputs.source-directory }}" `
            -FoundryProjectEndpoint "${{ vars.AZURE_AI_PROJECT_ENDPOINT }}" `
            -FoundryProjectId "${{ vars.AZURE_AI_PROJECT_ID }}" `
            -GrantAgentProjectAccess:([bool]::Parse("${{ inputs.grant-agent-project-access }}"))

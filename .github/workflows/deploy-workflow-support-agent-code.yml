name: Deploy workflow-support-agent (code, VNet self-hosted)

# Thin caller for the CODE (source-zip) deploy of workflow-support-agent
# (agents/workflow-support-agent/agent-code.yaml, definition.code_configuration). All the work lives
# in the reusable .github/workflows/_deploy-code-agent.yml - this file only targets ONE agent: it
# points at the code manifest and the build context (the .Agent project holding the Dockerfile).
#
# Unlike support-case-agent (a single prompt), this agent hosts a DECLARATIVE workflow
# (workflow.yaml) and, at startup, builds an IN-PROCESS `workflow_support_reasoner` helper agent
# that the workflow's InvokeAzureAgent steps resolve against (via a custom ResponseAgentProvider) -
# no extra persisted Foundry agent is created. The hosted agent's runtime identity only needs the
# usual model access on the project (same as support-case-agent).
#
# Code (source-zip) path only - no container-image variant for this agent. Teams publishing is off
# by default (no agent-network.json exposeToM365 route yet).
on:
  workflow_dispatch:
    inputs:
      publishToTeams:
        description: "After deploy, publish this agent to Teams / M365 (requires exposeToM365 + manual approval)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-code-agent.yml
    with:
      manifest-path: agents/workflow-support-agent/agent-code.yaml
      build-context: agents/workflow-support-agent/workflow-support-agent.Agent
      entry-dll: workflow-support-agent.Agent.dll
      publish-to-teams: ${{ inputs.publishToTeams }}

name: Deploy support-case-agent (hosted, VNet self-hosted)

# Thin caller for the HOSTED support-case-agent (agents/support-case-agent/agent.yaml,
# definition.kind: hosted). All the work lives in the reusable
# .github/workflows/_deploy-hosted-agent.yml — this file only targets ONE agent: it points at the
# manifest and the build context (the .Agent project holding the Dockerfile). The image is built
# server-side with `az acr build`, pushed to the private ACR, and its reference patched into the
# manifest's `{{agentAcrImage}}` before create/publish. Teams publishing is off by default (this
# agent has no agent-network.json exposeToM365 route yet).
on:
  workflow_dispatch:
    inputs:
      publishToTeams:
        description: "After deploy, publish this agent to Teams / M365 (requires exposeToM365 + manual approval)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-hosted-agent.yml
    with:
      manifest-path: agents/support-case-agent/agent.yaml
      build-context: agents/support-case-agent/support-case-agent.Agent
      image-repository: support-case-agent
      publish-to-teams: ${{ inputs.publishToTeams }}

name: Deploy support-case-agent
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-lifecycle
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-code-agent.yml
    with:
      agent-directory: agents/support-case-agent
      source-directory: support-case-agent.Agent

  governance:
    needs: deploy
    uses: ./.github/workflows/deploy-agent-network.yml

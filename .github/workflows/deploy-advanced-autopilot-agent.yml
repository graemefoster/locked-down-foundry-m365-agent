name: Deploy advanced-autopilot-agent
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-lifecycle
  cancel-in-progress: false

jobs:
  deploy-govern-publish:
    if: github.repository == 'graemefoster/locked-down-foundry-m365-agent'
    runs-on: [self-hosted, vnet, foundry-private]
    steps:
      - uses: actions/checkout@v5

      - uses: Azure/setup-azd@v2

      - name: Install the Foundry agents extension
        shell: bash
        run: azd extension install azure.ai.agents --version 1.0.0-beta.13 --force

      - name: Sign in and acquire the delegated user token
        shell: pwsh
        run: |
          azd auth login `
            --use-device-code `
            --tenant-id "${{ vars.TEAMS_TENANT_ID }}"
          if ($LASTEXITCODE -ne 0) { throw "Interactive azd login failed." }

          $token = azd auth token `
            --tenant-id "${{ vars.TEAMS_TENANT_ID }}" `
            --scope https://ai.azure.com/.default
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($token)) {
            throw "Could not acquire the delegated user token."
          }

          Write-Host "::add-mask::$token"
          "PUBLISH_USER_TOKEN=$token" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Deploy the agent with azd
        shell: bash
        working-directory: agents/advanced-autopilot-agent
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_AI_PROJECT_ID: ${{ vars.AZURE_AI_PROJECT_ID }}
          AZURE_AI_PROJECT_ENDPOINT: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
          AZURE_AI_MODEL_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME }}
        run: |
          azd env new github-actions --no-prompt
          azd env set AZURE_SUBSCRIPTION_ID "$AZURE_SUBSCRIPTION_ID"
          azd env set AZURE_LOCATION "$AZURE_LOCATION"
          azd env set AZURE_AI_PROJECT_ID "$AZURE_AI_PROJECT_ID"
          azd env set AZURE_AI_PROJECT_ENDPOINT "$AZURE_AI_PROJECT_ENDPOINT"
          azd env set FOUNDRY_PROJECT_ENDPOINT "$AZURE_AI_PROJECT_ENDPOINT"
          azd env set AZURE_AI_MODEL_DEPLOYMENT_NAME "$AZURE_AI_MODEL_DEPLOYMENT_NAME"
          azd provision --no-prompt
          azd deploy advanced-autopilot-agent --no-prompt

      - name: Sign in with the VM managed identity
        shell: pwsh
        run: az login --identity --output none

      - name: Apply Foundry token limits
        shell: pwsh
        run: |
          ./scripts/apply-token-limits.ps1 `
            -ResourceGroup "${{ vars.AZURE_RESOURCE_GROUP }}" `
            -ApimName "${{ vars.FOUNDRY_AGENTS_APIM_NAME }}" `
            -ApiName "${{ vars.FOUNDRY_AGENTS_API_NAME }}" `
            -FoundryAccountName "${{ vars.FOUNDRY_AGENTS_ACCOUNT_NAME }}" `
            -FoundryApiPath "${{ vars.FOUNDRY_AGENTS_API_PATH }}" `
            -CallerAudience "${{ vars.FOUNDRY_AGENTS_AUDIENCE }}"

      - name: Apply YARP routes
        shell: pwsh
        run: |
          ./scripts/apply-yarp-routes.ps1 `
            -ResourceGroup "${{ vars.AZURE_RESOURCE_GROUP }}" `
            -YarpWebAppName "${{ vars.TEAMS_YARP_WEBAPP_NAME }}" `
            -FoundryApiPath "${{ vars.FOUNDRY_AGENTS_API_PATH }}" `
            -TeamsApiName "${{ vars.TEAMS_APIM_API_NAME }}"

      - name: Apply the MCP allowlist
        shell: pwsh
        run: |
          ./scripts/apply-mcp-policy.ps1 `
            -FoundryProjectEndpoint "${{ vars.AZURE_AI_PROJECT_ENDPOINT }}" `
            -ResourceGroup "${{ vars.AZURE_RESOURCE_GROUP }}" `
            -ApimName "${{ vars.MCP_COMPLIANCE_APIM_NAME }}" `
            -McpWebAppName "${{ vars.MCP_WEBAPP_NAME }}" `
            -McpAudience "${{ vars.MCP_COMPLIANCE_AUDIENCE }}"

      - name: Apply Teams bot audiences
        shell: pwsh
        run: |
          ./scripts/apply-teams-audiences.ps1 `
            -FoundryProjectEndpoint "${{ vars.AZURE_AI_PROJECT_ENDPOINT }}" `
            -ResourceGroup "${{ vars.AZURE_RESOURCE_GROUP }}" `
            -ApimName "${{ vars.TEAMS_APIM_NAME }}" `
            -FoundryAccountName "${{ vars.FOUNDRY_AGENTS_ACCOUNT_NAME }}" `
            -FoundryApiPath "${{ vars.FOUNDRY_AGENTS_API_PATH }}"

      - name: Publish the Autopilot
        shell: pwsh
        run: |
          ./scripts/publish-autopilot.ps1 `
            -AgentDirectory agents/advanced-autopilot-agent `
            -FoundryProjectEndpoint "${{ vars.AZURE_AI_PROJECT_ENDPOINT }}" `
            -PublishAccessToken $env:PUBLISH_USER_TOKEN

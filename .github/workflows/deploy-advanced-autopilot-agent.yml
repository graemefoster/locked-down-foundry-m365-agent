name: Deploy advanced-autopilot-agent
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy to the configured project, or only republish the existing grfpublicfoundry agent.
        type: choice
        options:
          - deploy-and-publish
          - republish-grfpublicfoundry
        default: deploy-and-publish
        required: true

permissions:
  contents: read

concurrency:
  group: agent-lifecycle
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.operation != 'republish-grfpublicfoundry'
    uses: ./.github/workflows/_deploy-code-agent.yml
    with:
      agent-directory: agents/advanced-autopilot-agent
      source-directory: hello_world_a365_agent
      grant-agent-project-access: true

  governance:
    needs: deploy
    uses: ./.github/workflows/deploy-agent-network.yml

  publish:
    needs: governance
    if: ${{ !cancelled() && (inputs.operation == 'republish-grfpublicfoundry' || needs.governance.result == 'success') }}
    uses: ./.github/workflows/publish-teams.yml
    with:
      agent-directory: agents/advanced-autopilot-agent
      foundry-project-endpoint: ${{ inputs.operation == 'republish-grfpublicfoundry' && 'https://grfpublicfoundry.services.ai.azure.com/api/projects/proj-default' || '' }}

name: Deploy support-case-agent image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-hosted-agent.yml
    with:
      agent-manifest: agents/support-case-agent/agent-image.yaml
      build-context: agents/support-case-agent/support-case-agent.Agent
      image-repository: agents/support-case-agent

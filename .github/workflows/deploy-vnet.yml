name: Deploy (VNet self-hosted)

# ---------------------------------------------------------------------------
# Posture A gate: this is the ONLY workflow that runs on the self-hosted runner
# inside the VNet. It is deliberately locked down so untrusted code can never
# execute on the VM:
#   * NO pull_request trigger  -> forks cannot queue a job here.
#   * workflow_dispatch only    -> a maintainer must launch it by hand.
#   * environment: vnet-deploy  -> add a REQUIRED REVIEWER + branch=main to this
#                                  environment in repo Settings so the job pauses
#                                  for manual approval before touching the VM.
#   * repository guard          -> extra belt-and-braces against fork contexts.
#
# The runner is inside the VNet, so it reaches the PRIVATE Foundry endpoint
# directly. No `az login` is needed for seeding: seed-agents.ps1 uses the VM's
# managed identity via IMDS, exactly as the predeploy hook's run-command path does.
#
# The OPTIONAL publish path (publishToTeams=true) additionally creates each agent's
# Azure Bot Service and publishes it to Teams / M365, all AS THE VM MANAGED IDENTITY
# (Contributor on the resource group, granted when the runner is installed). az is
# preinstalled on the VM by the runner bootstrap. Note: the Microsoft 365 publish
# step may require a delegated USER token; this path deliberately uses the app-only
# MI token to confirm whether that is the case.
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      foundryProjectEndpoint:
        description: "Foundry project endpoint (defaults to repo variable AZURE_AI_PROJECT_ENDPOINT)"
        required: false
        default: ""
      modelDeploymentName:
        description: "Model deployment name (defaults to repo variable AZURE_AI_MODEL_DEPLOYMENT_NAME)"
        required: false
        default: ""
      publishToTeams:
        description: "Also publish the seeded agent(s) to Teams / M365 (creates a Bot Service per agent)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  seed-agents:
    if: github.repository == 'graemefoster/locked-down-foundry-m365-agent'
    runs-on: [self-hosted, vnet, foundry-private]
    environment: vnet-deploy
    steps:
      - uses: actions/checkout@v5

      - name: Seed Foundry agents (in-VNet, via VM managed identity)
        shell: pwsh
        env:
          # Prefer the dispatch input, fall back to a repo/environment variable.
          FOUNDRY_ENDPOINT: ${{ inputs.foundryProjectEndpoint != '' && inputs.foundryProjectEndpoint || vars.AZURE_AI_PROJECT_ENDPOINT }}
          MODEL_DEPLOYMENT: ${{ inputs.modelDeploymentName != '' && inputs.modelDeploymentName || vars.AZURE_AI_MODEL_DEPLOYMENT_NAME }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FOUNDRY_ENDPOINT) -or [string]::IsNullOrWhiteSpace($env:MODEL_DEPLOYMENT)) {
            throw "Set repo variables AZURE_AI_PROJECT_ENDPOINT and AZURE_AI_MODEL_DEPLOYMENT_NAME, or pass them as dispatch inputs."
          }
          ./scripts/seed-agents.ps1 `
            -FoundryProjectEndpoint $env:FOUNDRY_ENDPOINT `
            -ModelDeploymentName    $env:MODEL_DEPLOYMENT

      # --- Optional: publish to Teams / M365 (as the VM managed identity) -------
      - name: Verify Azure CLI is available
        if: ${{ inputs.publishToTeams }}
        shell: pwsh
        run: |
          # az is installed by cloud-init on the Linux worker VM.
          if (-not (Get-Command az -ErrorAction SilentlyContinue)) {
            throw "Azure CLI not found on the VM. Re-run 'azd provision' so cloud-init installs it."
          }
          az version

      # The Microsoft 365 publish step (Step 4) does an on-behalf-of submission and
      # rejects an app-only / managed-identity token (HTTP 502). Acquire a DELEGATED
      # USER token interactively via the device-code flow: the step prints a code +
      # URL and blocks until you complete sign-in in a browser. Nothing secret is
      # logged (the device code alone is useless; the token is masked), so this is
      # safe on a public repo. This token is used ONLY for the publish call.
      - name: Acquire a delegated user token (device code)
        if: ${{ inputs.publishToTeams }}
        shell: pwsh
        env:
          TENANT_ID: ${{ vars.TEAMS_TENANT_ID }}
        run: |
          Write-Host '>>> A device-code sign-in is required for the Microsoft 365 publish step.'
          Write-Host '>>> Open the URL below and enter the code, then this job will continue.'
          az login --use-device-code --tenant $env:TENANT_ID --output none
          if ($LASTEXITCODE -ne 0) { throw 'Device-code sign-in failed.' }
          $userToken = az account get-access-token --resource https://ai.azure.com --query accessToken -o tsv
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($userToken)) {
            throw 'Failed to acquire a user access token after device-code sign-in.'
          }
          Write-Host "::add-mask::$userToken"
          "PUBLISH_USER_TOKEN=$userToken" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'Delegated user token acquired for the publish step.'

      - name: Sign in with the VM managed identity
        if: ${{ inputs.publishToTeams }}
        shell: pwsh
        # Restore the MI as the active az context so bot-service ARM creation and the
        # Foundry read run as the VM managed identity (which holds the required RBAC).
        run: az login --identity --output none

      - name: Publish agent(s) to Teams / M365 (in-VNet, via VM managed identity)
        if: ${{ inputs.publishToTeams }}
        shell: pwsh
        env:
          FOUNDRY_ENDPOINT: ${{ inputs.foundryProjectEndpoint != '' && inputs.foundryProjectEndpoint || vars.AZURE_AI_PROJECT_ENDPOINT }}
          RESOURCE_GROUP:   ${{ vars.AZURE_RESOURCE_GROUP }}
          AGENT_NAMES:      ${{ vars.TEAMS_PUBLISH_AGENT_NAMES }}
          YARP_FQDN:        ${{ vars.TEAMS_YARP_FQDN }}
          TENANT_ID:        ${{ vars.TEAMS_TENANT_ID }}
          BOT_NAME:         ${{ vars.TEAMS_BOT_NAME }}
          NAME_PREFIX:      ${{ vars.TEAMS_NAME_PREFIX }}
          LOG_ANALYTICS_ID: ${{ vars.TEAMS_LOG_ANALYTICS_ID }}
          PUBLISH_SCOPE:    ${{ vars.TEAMS_PUBLISH_SCOPE }}
        run: |
          foreach ($v in 'FOUNDRY_ENDPOINT','RESOURCE_GROUP','AGENT_NAMES','YARP_FQDN','TENANT_ID','BOT_NAME') {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$v" -ErrorAction SilentlyContinue).Value)) {
              throw "Publish requires repo variable '$v'. Set AZURE_RESOURCE_GROUP, TEAMS_PUBLISH_AGENT_NAMES, TEAMS_YARP_FQDN, TEAMS_TENANT_ID and TEAMS_BOT_NAME (from 'azd env get-values')."
            }
          }
          $scope = if ([string]::IsNullOrWhiteSpace($env:PUBLISH_SCOPE)) { 'Shared' } else { $env:PUBLISH_SCOPE }
          ./scripts/publish-teams-runner.ps1 `
            -FoundryProjectEndpoint   $env:FOUNDRY_ENDPOINT `
            -ResourceGroup            $env:RESOURCE_GROUP `
            -AgentNames               $env:AGENT_NAMES `
            -YarpFqdn                 $env:YARP_FQDN `
            -TenantId                 $env:TENANT_ID `
            -BotName                  $env:BOT_NAME `
            -NamePrefix               $env:NAME_PREFIX `
            -LogAnalyticsWorkspaceId  $env:LOG_ANALYTICS_ID `
            -PublishScope             $scope `
            -PublishAccessToken       $env:PUBLISH_USER_TOKEN

name: Deploy support-case-agent-ghcpsdk
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-lifecycle
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-code-agent.yml
    with:
      agent-manifest: agents/support-case-agent-ghcpsdk/agent.yaml
      build-context: agents/support-case-agent-ghcpsdk/src/agent
      entry-dll: support-case-agent-ghcpsdk.Agent.dll

  governance:
    needs: deploy
    uses: ./.github/workflows/deploy-agent-network.yml

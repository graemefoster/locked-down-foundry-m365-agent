name: Deploy compliancy (MCP rate limits)

# ---------------------------------------------------------------------------
# On-demand re-apply of the MCP per-agent rate-limit policies from mcp/mcp-policy.json
# into APIM. This is the fast path used after editing the JSON — it re-deploys ONLY the
# apim-mcp-compliance-all.bicep wrapper (the same module `azd up` runs), which loops every
# server in mcp/mcp.json and applies that server's policy, so the two paths can never
# diverge. A full `azd up` is not required just to change rate limits.
#
# NAME-ONLY policy + deploy-time resolution:
#   mcp/mcp-policy.json lists agents by NAME only (no AppId GUIDs committed). This workflow runs
#   scripts/list-agent-appids.ps1 -ResolvePolicyPath to join each name to its live AgentIdentity
#   AppId via Microsoft Graph (az ad sp list on the SP '<account>-<project>-<name>-AgentIdentity')
#   — dropping any name with no matching identity — then passes the resolved (AppId-enriched)
#   policy to the Bicep wrapper as the `mcpPolicy` parameter. This workflow is now the ONLY way
#   MCP compliance is applied — azd runs nothing after provision, so run this after `azd up`
#   (once the agents are deployed by the per-agent deploy-*-agent.yml workflows) and again
#   whenever you edit the JSON.
#
# Runner:
#   Resolution is now a CONTROL-PLANE call (Graph), and applying the APIM policy is an ARM
#   control-plane op — neither needs the private Foundry data plane, so this no longer requires the
#   in-VNet runner. It is kept on the self-hosted VNet runner only to reuse the VM managed identity
#   (Contributor on the resource group) and the same lockdown as the deploy workflows. IMPORTANT: the VM
#   managed identity must also be granted Microsoft Graph Directory.Read.All (or Application.Read.All)
#   so `az ad sp list` can read the agent identity SPs; interactive users usually have this already.
#   Lockdown: workflow_dispatch only (forks cannot queue), repository guard, and the `vnet-deploy`
#   environment (add a REQUIRED REVIEWER + branch=main in repo Settings for an approval gate).
#
# Prerequisites (from `azd env get-values` / Bicep outputs, set as repo variables):
#   AZURE_RESOURCE_GROUP, MCP_COMPLIANCE_APIM_NAME, MCP_COMPLIANCE_AUDIENCE,
#   AZURE_AI_ACCOUNT_NAME, AZURE_AI_PROJECT_NAME. Run `azd env refresh` if any are missing. Each
#   can be overridden per-run via the dispatch inputs below. Which servers get a policy is driven
#   by mcp/mcp.json (no input needed).
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      resourceGroup:
        description: "Resource group (defaults to repo variable AZURE_RESOURCE_GROUP)"
        required: false
        default: ""
      apimName:
        description: "APIM instance name (defaults to repo variable MCP_COMPLIANCE_APIM_NAME)"
        required: false
        default: ""
      mcpAudience:
        description: "MCP app registration audience (defaults to repo variable MCP_COMPLIANCE_AUDIENCE)"
        required: false
        default: ""
      accountName:
        description: "Foundry account name (defaults to repo variable AZURE_AI_ACCOUNT_NAME)"
        required: false
        default: ""
      projectName:
        description: "Foundry project name (defaults to repo variable AZURE_AI_PROJECT_NAME)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  apply-mcp-compliance:
    if: github.repository == 'graemefoster/locked-down-foundry-m365-agent'
    runs-on: [self-hosted, vnet, foundry-private]
    environment: vnet-deploy
    steps:
      - uses: actions/checkout@v5

      # az is installed on the Linux worker VM by cloud-init. Authenticate as the VM
      # managed identity (holds Contributor on the resource group) — no secrets needed.
      - name: Sign in with the VM managed identity
        shell: pwsh
        run: az login --identity --output none

      - name: Resolve agent names to AppIds and apply MCP rate-limit policies
        shell: pwsh
        env:
          RESOURCE_GROUP: ${{ inputs.resourceGroup != '' && inputs.resourceGroup || vars.AZURE_RESOURCE_GROUP }}
          APIM_NAME:      ${{ inputs.apimName != '' && inputs.apimName || vars.MCP_COMPLIANCE_APIM_NAME }}
          MCP_AUDIENCE:   ${{ inputs.mcpAudience != '' && inputs.mcpAudience || vars.MCP_COMPLIANCE_AUDIENCE }}
          ACCOUNT_NAME:   ${{ inputs.accountName != '' && inputs.accountName || vars.AZURE_AI_ACCOUNT_NAME }}
          PROJECT_NAME:   ${{ inputs.projectName != '' && inputs.projectName || vars.AZURE_AI_PROJECT_NAME }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RESOURCE_GROUP) -or
              [string]::IsNullOrWhiteSpace($env:APIM_NAME) -or
              [string]::IsNullOrWhiteSpace($env:MCP_AUDIENCE) -or
              [string]::IsNullOrWhiteSpace($env:ACCOUNT_NAME) -or
              [string]::IsNullOrWhiteSpace($env:PROJECT_NAME)) {
            throw "Set repo variables AZURE_RESOURCE_GROUP, MCP_COMPLIANCE_APIM_NAME, MCP_COMPLIANCE_AUDIENCE, AZURE_AI_ACCOUNT_NAME and AZURE_AI_PROJECT_NAME (from 'azd env get-values'), or pass them as dispatch inputs."
          }
          $tenantId = az account show --query tenantId -o tsv
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tenantId)) {
            throw "Failed to resolve tenant ID from 'az account show'."
          }

          # Resolve the name-only mcp/mcp-policy.json against LIVE agent identities via Graph
          # (az ad sp list on '<account>-<project>-<name>-AgentIdentity'). Names with no matching SP
          # are dropped (deny-by-default). Control-plane only — no private Foundry endpoint needed.
          $resolvedPolicy = Join-Path $env:RUNNER_TEMP 'resolved-mcp-policy.json'
          Write-Host "Resolving agent names -> AppIds for '$($env:ACCOUNT_NAME)-$($env:PROJECT_NAME)-<name>-AgentIdentity'."
          pwsh -NoProfile -File scripts/list-agent-appids.ps1 `
            -AccountName $env:ACCOUNT_NAME `
            -ProjectName $env:PROJECT_NAME `
            -ResolvePolicyPath mcp/mcp-policy.json `
            -OutFile $resolvedPolicy
          if ($LASTEXITCODE -ne 0) { throw "Agent name resolution failed." }
          if (-not (Test-Path $resolvedPolicy)) { throw "Resolver did not produce '$resolvedPolicy'." }

          Write-Host "Applying MCP compliance policies to APIM '$($env:APIM_NAME)' in RG '$($env:RESOURCE_GROUP)' for every server in mcp/mcp.json."
          az deployment group create `
            --resource-group $env:RESOURCE_GROUP `
            --name "mcp-compliance-$(Get-Date -Format 'yyyyMMddHHmmss')" `
            --template-file infra/stages/30-governance/model-gateway/apim-mcp-compliance-all.bicep `
            --parameters `
              apimName=$env:APIM_NAME `
              mcpAudience=$env:MCP_AUDIENCE `
              tenantId=$tenantId `
              "mcpPolicy=@$resolvedPolicy" `
            --output none
          if ($LASTEXITCODE -ne 0) { throw "MCP compliance deployment failed." }
          Write-Host "MCP rate-limit policies applied (resolved from mcp/mcp-policy.json)."

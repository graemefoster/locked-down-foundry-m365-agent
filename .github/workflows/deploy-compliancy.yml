name: Deploy compliancy (MCP rate limits)

# ---------------------------------------------------------------------------
# On-demand re-apply of the MCP per-agent rate-limit policies from mcp/mcp-policy.json
# into APIM. This is the fast path used after editing the JSON — it re-deploys ONLY the
# apim-mcp-compliance-all.bicep wrapper (the same module `azd up` runs), which loops every
# server in mcp/mcp.json and applies that server's policy, so the two paths can never
# diverge. A full `azd up` is not required just to change rate limits.
#
# NAME-ONLY policy + deploy-time resolution:
#   mcp/mcp-policy.json lists agents by NAME only (no AppId GUIDs committed). This workflow
#   runs scripts/list-agent-appids.ps1 -ResolvePolicyPath ON THIS in-VNet runner to join each
#   name to its LIVE agent identity (instance_identity.client_id) — dropping any name with no
#   matching live agent — then passes the resolved (AppId-enriched) policy to the Bicep wrapper
#   as the `mcpPolicy` parameter. `azd up` cannot do this (agents are seeded AFTER provision),
#   so it applies deny-all; this workflow is what actually grants agents their rate limits.
#
# Why this runs on the self-hosted VNet runner (not a GitHub-hosted runner):
#   * Reaching the PRIVATE Foundry endpoint to enumerate agents requires being inside the VNet
#     (and the VM managed-identity IMDS token). Applying the APIM policy is an ARM CONTROL-PLANE
#     operation, so it does NOT need APIM's private data-plane; it DOES need Azure RBAC, which
#     the VM managed identity already has (Contributor on the resource group). Reusing the VM MI
#     avoids provisioning any new OIDC federated credential.
#   * Same lockdown as deploy-vnet.yml: workflow_dispatch only (forks cannot queue),
#     repository guard, and the `vnet-deploy` environment (add a REQUIRED REVIEWER +
#     branch=main in repo Settings so an approval gate precedes any change to APIM).
#
# Prerequisites (from `azd env get-values` / Bicep outputs, set as repo variables):
#   AZURE_RESOURCE_GROUP, MCP_COMPLIANCE_APIM_NAME, MCP_COMPLIANCE_AUDIENCE,
#   AZURE_AI_PROJECT_ENDPOINT. Run `azd env refresh` if any are missing. Each can be
#   overridden per-run via the dispatch inputs below. Which servers get a policy is driven
#   by mcp/mcp.json (no input needed).
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      resourceGroup:
        description: "Resource group (defaults to repo variable AZURE_RESOURCE_GROUP)"
        required: false
        default: ""
      apimName:
        description: "APIM instance name (defaults to repo variable MCP_COMPLIANCE_APIM_NAME)"
        required: false
        default: ""
      mcpAudience:
        description: "MCP app registration audience (defaults to repo variable MCP_COMPLIANCE_AUDIENCE)"
        required: false
        default: ""
      projectEndpoint:
        description: "Foundry project endpoint for name->AppId resolution (defaults to repo variable AZURE_AI_PROJECT_ENDPOINT)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  apply-mcp-compliance:
    if: github.repository == 'graemefoster/locked-down-foundry-m365-agent'
    runs-on: [self-hosted, vnet, foundry-private]
    environment: vnet-deploy
    steps:
      - uses: actions/checkout@v5

      # az is installed on the Linux worker VM by cloud-init. Authenticate as the VM
      # managed identity (holds Contributor on the resource group) — no secrets needed.
      - name: Sign in with the VM managed identity
        shell: pwsh
        run: az login --identity --output none

      - name: Resolve agent names to AppIds and apply MCP rate-limit policies
        shell: pwsh
        env:
          RESOURCE_GROUP:   ${{ inputs.resourceGroup != '' && inputs.resourceGroup || vars.AZURE_RESOURCE_GROUP }}
          APIM_NAME:        ${{ inputs.apimName != '' && inputs.apimName || vars.MCP_COMPLIANCE_APIM_NAME }}
          MCP_AUDIENCE:     ${{ inputs.mcpAudience != '' && inputs.mcpAudience || vars.MCP_COMPLIANCE_AUDIENCE }}
          PROJECT_ENDPOINT: ${{ inputs.projectEndpoint != '' && inputs.projectEndpoint || vars.AZURE_AI_PROJECT_ENDPOINT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RESOURCE_GROUP) -or
              [string]::IsNullOrWhiteSpace($env:APIM_NAME) -or
              [string]::IsNullOrWhiteSpace($env:MCP_AUDIENCE) -or
              [string]::IsNullOrWhiteSpace($env:PROJECT_ENDPOINT)) {
            throw "Set repo variables AZURE_RESOURCE_GROUP, MCP_COMPLIANCE_APIM_NAME, MCP_COMPLIANCE_AUDIENCE and AZURE_AI_PROJECT_ENDPOINT (from 'azd env get-values'), or pass them as dispatch inputs."
          }
          $tenantId = az account show --query tenantId -o tsv
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tenantId)) {
            throw "Failed to resolve tenant ID from 'az account show'."
          }

          # Resolve the name-only mcp/mcp-policy.json against LIVE agents (private endpoint,
          # VM managed-identity IMDS token) into an AppId-enriched policy. Names with no live
          # agent are dropped (deny-by-default). This runs here because Bicep cannot call Foundry.
          $resolvedPolicy = Join-Path $env:RUNNER_TEMP 'resolved-mcp-policy.json'
          Write-Host "Resolving agent names -> AppIds from '$($env:PROJECT_ENDPOINT)'."
          pwsh -NoProfile -File scripts/list-agent-appids.ps1 `
            -FoundryProjectEndpoint $env:PROJECT_ENDPOINT `
            -ResolvePolicyPath mcp/mcp-policy.json `
            -OutFile $resolvedPolicy
          if ($LASTEXITCODE -ne 0) { throw "Agent name resolution failed." }
          if (-not (Test-Path $resolvedPolicy)) { throw "Resolver did not produce '$resolvedPolicy'." }

          Write-Host "Applying MCP compliance policies to APIM '$($env:APIM_NAME)' in RG '$($env:RESOURCE_GROUP)' for every server in mcp/mcp.json."
          az deployment group create `
            --resource-group $env:RESOURCE_GROUP `
            --name "mcp-compliance-$(Get-Date -Format 'yyyyMMddHHmmss')" `
            --template-file infra/modules/model-gateway/apim-mcp-compliance-all.bicep `
            --parameters `
              apimName=$env:APIM_NAME `
              mcpAudience=$env:MCP_AUDIENCE `
              tenantId=$tenantId `
              "mcpPolicy=@$resolvedPolicy" `
            --output none
          if ($LASTEXITCODE -ne 0) { throw "MCP compliance deployment failed." }
          Write-Host "MCP rate-limit policies applied (resolved from mcp/mcp-policy.json)."

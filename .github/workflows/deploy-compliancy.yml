name: Deploy compliancy (MCP rate limits)

# ---------------------------------------------------------------------------
# On-demand re-apply of the MCP per-agent rate-limit policies from mcp/mcp-policy.json
# into APIM. This is the fast path used after editing the JSON — it re-deploys ONLY the
# apim-mcp-compliance-all.bicep wrapper (the same module `azd up` runs), which loops every
# server in mcp/mcp.json and applies that server's policy, so the two paths can never
# diverge. A full `azd up` is not required just to change rate limits.
#
# NAME-ONLY policy + deploy-time resolution:
#   mcp/mcp-policy.json lists agents by NAME only (no AppId GUIDs committed). This workflow runs
#   scripts/list-agent-appids.ps1 -ResolvePolicyPath to join each name to its live AppId read from
#   the Foundry DATA PLANE (instance_identity.client_id on the project endpoint) — dropping any
#   name with no matching / identity-less agent — then passes the resolved (AppId-enriched) policy
#   to the Bicep wrapper as the `mcpPolicy` parameter. This workflow is now the ONLY way MCP
#   compliance is applied — azd deploys no agents post-provision, so run this after `azd up` (once
#   the agents are deployed by the per-agent deploy-*-agent.yml workflows) and again whenever you
#   edit the JSON.
#
# Runner:
#   Resolution reads the Foundry DATA PLANE (the project endpoint is private), so this MUST run on
#   the in-VNet self-hosted runner — the VM authenticates to Foundry with its own managed identity
#   (IMDS) and holds Contributor on the resource group for the APIM policy deployment (an ARM
#   control-plane op). No Microsoft Graph permission is needed (the old control-plane resolver is
#   gone). Lockdown: workflow_dispatch only (forks cannot queue), repository guard, and the
#   `vnet-deploy` environment (add a REQUIRED REVIEWER + branch=main in repo Settings for an
#   approval gate).
#
# Prerequisites (from `azd env get-values` / Bicep outputs, set as repo variables — the
# postprovision hook syncs these automatically):
#   AZURE_RESOURCE_GROUP, MCP_COMPLIANCE_APIM_NAME, MCP_COMPLIANCE_AUDIENCE,
#   AZURE_AI_PROJECT_ENDPOINT. Run `azd env refresh` if any are missing. Which servers get a
#   policy is driven by mcp/mcp.json (no input needed).
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-mcp-compliance:
    if: github.repository == 'graemefoster/locked-down-foundry-m365-agent'
    runs-on: [self-hosted, vnet, foundry-private]
    steps:
      - uses: actions/checkout@v5

      # az is installed on the Linux worker VM by cloud-init. Authenticate as the VM
      # managed identity (holds Contributor on the resource group) — no secrets needed.
      - name: Sign in with the VM managed identity
        shell: pwsh
        run: az login --identity --output none

      - name: Resolve agent names to AppIds and apply MCP rate-limit policies
        shell: pwsh
        env:
          RESOURCE_GROUP:   ${{ vars.AZURE_RESOURCE_GROUP }}
          APIM_NAME:        ${{ vars.MCP_COMPLIANCE_APIM_NAME }}
          MCP_AUDIENCE:     ${{ vars.MCP_COMPLIANCE_AUDIENCE }}
          FOUNDRY_ENDPOINT: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RESOURCE_GROUP) -or
              [string]::IsNullOrWhiteSpace($env:APIM_NAME) -or
              [string]::IsNullOrWhiteSpace($env:MCP_AUDIENCE) -or
              [string]::IsNullOrWhiteSpace($env:FOUNDRY_ENDPOINT)) {
            throw "Set repo variables AZURE_RESOURCE_GROUP, MCP_COMPLIANCE_APIM_NAME, MCP_COMPLIANCE_AUDIENCE and AZURE_AI_PROJECT_ENDPOINT (the postprovision hook syncs them from the Bicep outputs; or run 'azd env refresh')."
          }
          $tenantId = az account show --query tenantId -o tsv
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tenantId)) {
            throw "Failed to resolve tenant ID from 'az account show'."
          }

          # Resolve the name-only mcp/mcp-policy.json against LIVE agent identities read from the
          # Foundry DATA PLANE (instance_identity.client_id on the project endpoint). Names with no
          # matching / identity-less agent are dropped (deny-by-default). Needs the private endpoint,
          # which the in-VNet runner can reach (VM managed identity via IMDS).
          $resolvedPolicy = Join-Path $env:RUNNER_TEMP 'resolved-mcp-policy.json'
          Write-Host "Resolving agent names -> AppIds from the Foundry project at '$($env:FOUNDRY_ENDPOINT)'."
          pwsh -NoProfile -File scripts/list-agent-appids.ps1 `
            -FoundryProjectEndpoint $env:FOUNDRY_ENDPOINT `
            -ResolvePolicyPath mcp/mcp-policy.json `
            -OutFile $resolvedPolicy
          if ($LASTEXITCODE -ne 0) { throw "Agent name resolution failed." }
          if (-not (Test-Path $resolvedPolicy)) { throw "Resolver did not produce '$resolvedPolicy'." }

          Write-Host "Applying MCP compliance policies to APIM '$($env:APIM_NAME)' in RG '$($env:RESOURCE_GROUP)' for every server in mcp/mcp.json."
          az deployment group create `
            --resource-group $env:RESOURCE_GROUP `
            --name "mcp-compliance-$(Get-Date -Format 'yyyyMMddHHmmss')" `
            --template-file infra/stages/30-governance/model-gateway/apim-mcp-compliance-all.bicep `
            --parameters `
              apimName=$env:APIM_NAME `
              mcpAudience=$env:MCP_AUDIENCE `
              tenantId=$tenantId `
              "mcpPolicy=@$resolvedPolicy" `
            --output none
          if ($LASTEXITCODE -ne 0) { throw "MCP compliance deployment failed." }
          Write-Host "MCP rate-limit policies applied (resolved from mcp/mcp-policy.json)."

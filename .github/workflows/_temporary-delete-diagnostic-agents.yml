name: Delete live diagnostic agents
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete:
    if: github.repository == 'graemefoster/locked-down-foundry-m365-agent'
    runs-on: [self-hosted, vnet, foundry-private]
    steps:
      - uses: actions/checkout@v5

      - name: Sign in interactively as the deleting user
        shell: pwsh
        run: |
          az login `
            --use-device-code `
            --tenant "${{ vars.TEAMS_TENANT_ID }}" `
            --output none
          if ($LASTEXITCODE -ne 0) { throw "Interactive az login failed." }

      - name: Delete diagnostic agents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $endpoint = "${{ vars.AZURE_AI_PROJECT_ENDPOINT }}".TrimEnd('/')
          $token = az account get-access-token `
            --resource https://ai.azure.com `
            --query accessToken `
            --output tsv
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($token)) {
            throw "Could not acquire the Foundry token."
          }

          $headers = @{ Authorization = "Bearer $token" }
          $agents = @(
            'gfdiag5-a12ddd'
            'gfdiag6-b91c7e'
            'gfdiag7-36f7d2'
            'gfdiag8-8c60b5'
          )

          foreach ($agentName in $agents) {
            $uri = "$endpoint/agents/${agentName}?api-version=2025-11-15-preview"
            try {
              Invoke-RestMethod -Method Delete -Uri $uri -Headers $headers | Out-Null
              Write-Host "Deleted live agent '$agentName'."
            }
            catch {
              $statusCode = if ($null -ne $_.Exception.Response) {
                [int]$_.Exception.Response.StatusCode
              }
              else {
                $null
              }

              if ($statusCode -eq 404) {
                Write-Host "Live agent '$agentName' was already absent."
                continue
              }

              throw
            }
          }

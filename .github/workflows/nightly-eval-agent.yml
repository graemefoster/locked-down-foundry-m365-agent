name: Nightly eval - teams-agent

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      agentIds:
        description: Agent id(s) as name:version, comma-separated. Defaults to the latest version.
        required: false
        default: ""
      baselineAgentId:
        description: Optional baseline agent id for an explicit comparison.
        required: false
        default: ""
      dataPath:
        description: Path to the evaluation data.
        required: false
        default: agents/teams-agent/eval-data.json

permissions:
  contents: read

jobs:
  evaluate:
    if: github.repository == 'graemefoster/locked-down-foundry-m365-agent'
    runs-on: [self-hosted, vnet, foundry-private]
    steps:
      - uses: actions/checkout@v5

      - name: Sign in with the VM managed identity
        shell: pwsh
        run: az login --identity --output none

      - name: Resolve evaluation inputs
        id: config
        shell: pwsh
        run: |
          $endpoint = "${{ vars.AZURE_AI_PROJECT_ENDPOINT }}".TrimEnd('/')
          $deployment = "${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME }}"
          $dataPath = "${{ inputs.dataPath }}"
          $agentIds = "${{ inputs.agentIds }}"
          $baseline = "${{ inputs.baselineAgentId }}"

          if ([string]::IsNullOrWhiteSpace($endpoint)) {
            throw "AZURE_AI_PROJECT_ENDPOINT is not set."
          }
          if ([string]::IsNullOrWhiteSpace($deployment)) {
            throw "AZURE_AI_MODEL_DEPLOYMENT_NAME is not set."
          }
          if (-not (Test-Path -LiteralPath $dataPath)) {
            throw "Evaluation data not found: $dataPath"
          }

          if ([string]::IsNullOrWhiteSpace($agentIds)) {
            $agent = Get-Content agents/teams-agent/agent.json -Raw | ConvertFrom-Json
            $token = az account get-access-token `
              --resource https://ai.azure.com `
              --query accessToken `
              --output tsv

            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($token)) {
              throw "Could not acquire a Foundry token."
            }

            $versions = Invoke-RestMethod `
              -Method Get `
              -Uri "$endpoint/agents/$($agent.name)/versions?api-version=2025-11-15-preview" `
              -Headers @{ Authorization = "Bearer $token" }

            $latest = @($versions.data.version | ForEach-Object { [int]$_ } | Sort-Object -Descending)[0]
            if ($null -eq $latest) {
              throw "No versions found for agent '$($agent.name)'."
            }

            $agentIds = "$($agent.name):$latest"
          }

          "endpoint=$endpoint" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "deployment=$deployment" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "agent-ids=$agentIds" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "baseline=$baseline" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "data-path=$dataPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install missing httpx dependency
        shell: pwsh
        run: python -m pip install --quiet httpx

      - name: Run agent evaluation
        uses: microsoft/ai-agent-evals@v3-beta
        with:
          azure-ai-project-endpoint: ${{ steps.config.outputs.endpoint }}
          deployment-name: ${{ steps.config.outputs.deployment }}
          data-path: ${{ github.workspace }}/${{ steps.config.outputs.data-path }}
          agent-ids: ${{ steps.config.outputs.agent-ids }}
          baseline-agent-id: ${{ steps.config.outputs.baseline }}

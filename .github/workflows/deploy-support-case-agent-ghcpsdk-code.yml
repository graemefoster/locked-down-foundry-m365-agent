name: Deploy support-case-agent-ghcpsdk
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-code-agent.yml
    with:
      agent-json: agents/support-case-agent-ghcpsdk/agent.json
      build-context: agents/support-case-agent-ghcpsdk/src/agent
      entry-dll: support-case-agent-ghcpsdk.Agent.dll

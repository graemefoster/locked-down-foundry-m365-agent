name: Deploy support-case-agent-ghcpsdk (code, VNet self-hosted)

# Thin caller for the CODE (source-zip) deploy of the GitHub Copilot SDK hosted agent
# support-case-agent-ghcpsdk (agents/support-case-agent-ghcpsdk/agent-code.yaml,
# definition.code_configuration). All the work lives in the reusable
# .github/workflows/_deploy-code-agent.yml, which builds the publish output ONCE (via the
# Dockerfile's `build` SDK stage - no .NET SDK needed on the runner), zips it, and promotes it
# build-once through dev then test (test gated by the `test` GitHub Environment).
#
# Foundry runs the publish output on its managed dotnet_10 runtime, so it never pulls from the
# private ACR. The bundled EscalationSkill implements its escalation tool as the `escalate`
# subcommand of this .NET agent binary, so there is no Python runtime dependency.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-code-agent.yml
    with:
      manifest-path: agents/support-case-agent-ghcpsdk/agent-code.yaml
      build-context: agents/support-case-agent-ghcpsdk/src/agent
      entry-dll: support-case-agent-ghcpsdk.Agent.dll

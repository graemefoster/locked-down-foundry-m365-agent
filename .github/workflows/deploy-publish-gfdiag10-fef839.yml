name: Deploy and publish gfdiag10-fef839
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-and-publish:
    if: github.repository == 'graemefoster/locked-down-foundry-m365-agent'
    runs-on: [self-hosted, vnet, foundry-private]
    steps:
      - uses: actions/checkout@v5

      - name: Create the Python source zip
        shell: pwsh
        run: |
          $context = "agents/grf-2026-autopilot-agent/simple-autopilot-agent"
          if (-not (Test-Path -LiteralPath (Join-Path $context "main.py"))) {
            throw "Python source does not contain 'main.py'."
          }
          git archive --format=zip --output=agent.zip "HEAD:$context"
          if ($LASTEXITCODE -ne 0) { throw "Could not create the Python source zip." }

      - name: Normalize the manifest
        shell: bash
        run: yq -o=json '.' "agents/gfdiag10-fef839/agent.yaml" > agent.json

      - name: Sign in and acquire the delegated user token
        shell: pwsh
        run: |
          az login `
            --use-device-code `
            --tenant "${{ vars.TEAMS_TENANT_ID }}" `
            --output none
          if ($LASTEXITCODE -ne 0) { throw "Interactive az login failed." }

          $who = az ad signed-in-user show --query userPrincipalName --output tsv
          Write-Host "Deploying and publishing as user: $who"

          $token = az account get-access-token `
            --resource https://ai.azure.com `
            --query accessToken `
            --output tsv
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($token)) {
            throw "Could not acquire the delegated user token."
          }

          Write-Host "::add-mask::$token"
          "PUBLISH_USER_TOKEN=$token" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Deploy the source-zip agent
        shell: pwsh
        run: |
          ./scripts/deploy-code-agent.ps1 `
            -AgentJsonPath agent.json `
            -ZipPath agent.zip `
            -FoundryProjectEndpoint "${{ vars.AZURE_AI_PROJECT_ENDPOINT }}"

      - name: Publish the Autopilot
        shell: pwsh
        run: |
          ./scripts/publish-autopilot.ps1 `
            -AgentDirectory agents/gfdiag10-fef839 `
            -FoundryProjectEndpoint "${{ vars.AZURE_AI_PROJECT_ENDPOINT }}" `
            -PublishAccessToken $env:PUBLISH_USER_TOKEN

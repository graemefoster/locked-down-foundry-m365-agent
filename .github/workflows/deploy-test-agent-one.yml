name: Deploy test-agent-one (VNet self-hosted)

# Thin caller for the CI/CD-tested agent (agents/test-agent-one/agent.yaml). All the work lives
# in the reusable .github/workflows/deploy-agent.yml — this file only targets ONE agent, supplies
# the per-environment MCP server URL injected into its MCP tool, and (by default) publishes it to
# Teams. The Teams publish is a separate job gated by the `vnet-deploy` environment for manual
# approval.
#
# Environment-agnostic MCP: agent.yaml deliberately omits the MCP tool's `server_url` and sets
# only `project_connection_id: testweathermcpserver` (auth). The concrete per-env endpoint is
# INJECTED by the reusable workflow (from the mcpServerUrl input or the MCP_SERVER_URL repo
# variable). Do NOT hardcode a server_url in the manifest.
on:
  workflow_dispatch:
    inputs:
      foundryProjectEndpoint:
        description: "Foundry project endpoint (defaults to repo variable AZURE_AI_PROJECT_ENDPOINT)"
        required: false
        default: ""
      mcpServerUrl:
        description: "MCP server URL to inject into the agent (defaults to repo variable MCP_SERVER_URL)"
        required: false
        default: ""
      apiVersion:
        description: "Agents REST API version"
        required: false
        default: "2025-11-15-preview"
      publishToTeams:
        description: "After deploy, publish the agent to Teams / M365 (requires manual approval)"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-agent.yml
    with:
      manifest-path: agents/test-agent-one/agent.yaml
      foundry-endpoint: ${{ inputs.foundryProjectEndpoint }}
      mcp-server-url: ${{ inputs.mcpServerUrl }}
      api-version: ${{ inputs.apiVersion }}
      publish-to-teams: ${{ inputs.publishToTeams }}

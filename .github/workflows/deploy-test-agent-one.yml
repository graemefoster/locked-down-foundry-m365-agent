name: Deploy test-agent-one (VNet self-hosted)

# ---------------------------------------------------------------------------
# Full CI/CD for the Foundry agent defined in agents/test-agent-one/agent.yaml.
#
# Why REST and not `azd` / the `azd ai agent` tooling:
#   * The `azure.ai.agent` extension only deploys HOSTED agents - containerized/code agents
#     with source under src/<agent>, a Dockerfile (or prebuilt image), listening on port 8088,
#     serving GET /readiness, speaking responses/invocations/a2a, and shipped as a ZIP/image to
#     ACR + a Capability Host. Our agent is a PROMPT agent (agent.yaml `kind: prompt` - just a
#     model + instructions + an MCP tool), so there is nothing to build/package/upload and the
#     azd deploy pipeline does not apply. agent.yaml / agent.manifest.yaml are also deprecated in
#     the azd tooling, which now speaks only the hosted `azure.yaml` schema.
#   * `azd deploy` uploads from the azd HOST, which in this locked-down setup cannot reach the
#     private Foundry endpoint (the very reason seeding runs via the in-VNet VM). REST calls made
#     from the in-VNet self-hosted runner can.
#   * azd CAN target an existing project without owning infra (`azd ai agent init --project-id`,
#     or `endpoint:` on the azure.ai.project service) - but that only helps HOSTED agents.
# So for a prompt agent, calling the Agents REST API (create/update version + publish) from the
# in-VNet runner is the correct and simplest path.
#
# Two-stage design driven by the network posture:
#   * prepare  (GitHub-hosted) - converts agent.yaml -> normalized JSON with `yq`. Needs no
#                                 secrets and no access to the private Foundry endpoint, so it
#                                 runs safely on an ephemeral hosted runner.
#   * deploy   (self-hosted, in-VNet) - the ONLY job that touches the PRIVATE Foundry endpoint.
#                                 workflow_dispatch only + a repository guard keep fork code off
#                                 the VM. It creates/updates the agent version, then publishes it
#                                 (routes 100% of traffic to the new version) with no manual gate,
#                                 authenticating as the VM managed identity via IMDS.
#
# Reusable steps live as composite actions:
#   .github/actions/create-agent   -> create-or-update (adds a new version when changed)
#   .github/actions/publish-agent  -> route 100% of endpoint traffic to that version (default)
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      foundryProjectEndpoint:
        description: "Foundry project endpoint (defaults to repo variable AZURE_AI_PROJECT_ENDPOINT)"
        required: false
        default: ""
      apiVersion:
        description: "Agents REST API version"
        required: false
        default: "2025-11-15-preview"

permissions:
  contents: read

env:
  MANIFEST_PATH: agents/test-agent-one/agent.yaml

jobs:
  # --- Stage 1: parse agent.yaml -> agent.json on a hosted runner --------------
  prepare:
    if: github.repository == 'graemefoster/locked-down-foundry-m365-agent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Convert agent.yaml -> agent.json (yq)
        env:
          MANIFEST: ${{ env.MANIFEST_PATH }}
        run: |
          if ! command -v yq >/dev/null 2>&1; then
            echo "::error::yq is required to convert the manifest but was not found on the runner."
            exit 1
          fi
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::Manifest not found: $MANIFEST"
            exit 1
          fi
          yq -o=json '.' "$MANIFEST" > agent.json
          name="$(yq -r '.name' "$MANIFEST")"
          if [ -z "$name" ] || [ "$name" = "null" ]; then
            echo "::error::Manifest '$MANIFEST' has no 'name'."
            exit 1
          fi
          echo "Prepared agent '$name':"
          cat agent.json

      - name: Upload agent.json
        uses: actions/upload-artifact@v7
        with:
          name: agent-json
          path: agent.json
          if-no-files-found: error
          retention-days: 1

  # --- Stage 2: create/update + publish against the PRIVATE endpoint -----------
  deploy:
    needs: prepare
    if: github.repository == 'graemefoster/locked-down-foundry-m365-agent'
    runs-on: [self-hosted, vnet, foundry-private]
    steps:
      - uses: actions/checkout@v5

      - name: Download agent.json
        uses: actions/download-artifact@v8
        with:
          name: agent-json

      - name: Resolve Foundry endpoint
        id: cfg
        shell: powershell
        env:
          INPUT_ENDPOINT: ${{ inputs.foundryProjectEndpoint }}
          VAR_ENDPOINT: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
        run: |
          $endpoint = if (-not [string]::IsNullOrWhiteSpace($env:INPUT_ENDPOINT)) { $env:INPUT_ENDPOINT } else { $env:VAR_ENDPOINT }
          if ([string]::IsNullOrWhiteSpace($endpoint)) {
            throw "Set repo variable AZURE_AI_PROJECT_ENDPOINT, or pass foundryProjectEndpoint as a dispatch input."
          }
          "endpoint=$endpoint" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create or update agent
        id: create
        uses: ./.github/actions/create-agent
        with:
          agent-json: agent.json
          foundry-endpoint: ${{ steps.cfg.outputs.endpoint }}
          api-version: ${{ inputs.apiVersion }}

      - name: Publish agent version
        uses: ./.github/actions/publish-agent
        with:
          agent-name: ${{ steps.create.outputs.agent-name }}
          agent-version: ${{ steps.create.outputs.agent-version }}
          foundry-endpoint: ${{ steps.cfg.outputs.endpoint }}
          api-version: ${{ inputs.apiVersion }}

name: Deploy gfnetdiag3-7fae7a (interactive)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'graemefoster/locked-down-foundry-m365-agent'
    runs-on: [self-hosted, vnet, foundry-private]
    steps:
      - uses: actions/checkout@v5

      - name: Create the Python source zip
        shell: pwsh
        run: |
          $context = "agents/autopilot-agent/simple-autopilot-agent"
          if (-not (Test-Path -LiteralPath (Join-Path $context "main.py"))) {
            throw "Python source does not contain 'main.py'."
          }
          git archive --format=zip --output=agent.zip "HEAD:$context"
          if ($LASTEXITCODE -ne 0) { throw "Could not create the Python source zip." }

      - name: Normalize the manifest (yq)
        shell: bash
        run: yq -o=json '.' "agents/gfnetdiag3-7fae7a/agent.yaml" > agent.json

      - name: Sign in interactively as the deploying user (device code)
        shell: pwsh
        run: |
          az login `
            --use-device-code `
            --tenant "${{ vars.TEAMS_TENANT_ID }}" `
            --output none
          if ($LASTEXITCODE -ne 0) { throw "Interactive az login failed." }

          $who = az ad signed-in-user show --query userPrincipalName --output tsv
          Write-Host "Deploying as user: $who"

      - name: Deploy and publish the source-zip agent
        shell: pwsh
        run: |
          ./scripts/deploy-code-agent.ps1 `
            -AgentJsonPath agent.json `
            -ZipPath agent.zip `
            -FoundryProjectEndpoint "${{ vars.AZURE_AI_PROJECT_ENDPOINT }}"

name: CI

# PR validation runs on GitHub-hosted runners ONLY. It never targets the
# self-hosted VNet runner, so untrusted fork-PR code cannot execute on the VM.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bicep-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Bicep CLI
        run: az bicep install
      - name: Build main.bicep (0 errors required; warnings expected)
        run: az bicep build --file infra/main.bicep

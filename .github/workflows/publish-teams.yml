name: Publish agent to Teams / M365

on:
  workflow_call:
    inputs:
      agent-directory:
        description: Directory containing agent.yaml, network.json, and teams.json.
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'graemefoster/locked-down-foundry-m365-agent'
    runs-on: [self-hosted, vnet, foundry-private]
    steps:
      - uses: actions/checkout@v5

      - name: Acquire the delegated user token
        shell: pwsh
        run: |
          az login `
            --use-device-code `
            --tenant "${{ vars.TEAMS_TENANT_ID }}" `
            --output none

          $token = az account get-access-token `
            --resource https://ai.azure.com `
            --query accessToken `
            --output tsv

          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($token)) {
            throw "Could not acquire the delegated user token."
          }

          Write-Host "::add-mask::$token"
          "PUBLISH_USER_TOKEN=$token" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore the VM managed identity
        shell: pwsh
        run: az login --identity --output none

      - name: Publish the agent
        shell: pwsh
        run: |
          ./scripts/publish-teams.ps1 `
            -AgentDirectory "${{ inputs.agent-directory }}" `
            -FoundryProjectEndpoint "${{ vars.AZURE_AI_PROJECT_ENDPOINT }}" `
            -ResourceGroup "${{ vars.AZURE_RESOURCE_GROUP }}" `
            -YarpFqdn "${{ vars.TEAMS_YARP_FQDN }}" `
            -TenantId "${{ vars.TEAMS_TENANT_ID }}" `
            -BotName "${{ vars.TEAMS_BOT_NAME }}" `
            -LogAnalyticsWorkspaceId "${{ vars.TEAMS_LOG_ANALYTICS_ID }}" `
            -PublishAccessToken $env:PUBLISH_USER_TOKEN

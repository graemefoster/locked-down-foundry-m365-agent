name: (diag) runner docker capabilities

# TEMPORARY diagnostic — inspect the in-VNet runner's Docker/buildx capabilities and egress so we
# can pick the right OCI-media-type build strategy. Delete after use.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: [self-hosted, vnet, foundry-private]
    steps:
      - name: Inspect docker + buildx + daemon + egress
        shell: bash
        run: |
          set +e
          echo "=================== docker version ==================="
          docker version
          echo "=================== docker info (snapshotter/driver) ==================="
          docker info 2>/dev/null | grep -iE "server version|storage driver|driver-type|snapshotter|cgroup" || true
          docker info --format '{{json .DriverStatus}}' 2>/dev/null; echo
          echo "containerd-snapshotter feature currently: $(docker info --format '{{json .}}' 2>/dev/null | grep -o 'io.containerd.snapshotter' || echo 'not-reported')"
          echo "=================== daemon.json ==================="
          cat /etc/docker/daemon.json 2>/dev/null || echo "(no /etc/docker/daemon.json)"
          echo "=================== buildx presence ==================="
          echo "which docker-buildx: $(which docker-buildx 2>/dev/null || echo none)"
          ls -la /usr/libexec/docker/cli-plugins/ 2>/dev/null || true
          ls -la ~/.docker/cli-plugins/ 2>/dev/null || true
          echo "docker buildx version:"; docker buildx version 2>&1 | head -3
          echo "=================== apt candidate: docker-buildx / skopeo ==================="
          . /etc/os-release; echo "OS: $PRETTY_NAME ($VERSION_CODENAME)"
          apt-cache policy docker-buildx 2>/dev/null | head -5 || echo "apt-cache docker-buildx failed"
          apt-cache policy skopeo 2>/dev/null | head -5 || echo "apt-cache skopeo failed"
          echo "=================== egress: Docker Hub (moby/buildkit) ==================="
          curl -sS -o /dev/null -w "auth.docker.io -> HTTP %{http_code}\n" --max-time 15 https://auth.docker.io/token?service=registry.docker.io 2>&1 || echo "auth.docker.io UNREACHABLE"
          curl -sS -o /dev/null -w "registry-1.docker.io -> HTTP %{http_code}\n" --max-time 15 https://registry-1.docker.io/v2/ 2>&1 || echo "registry-1.docker.io UNREACHABLE"
          echo "=================== egress: mcr (baseline, should work) ==================="
          curl -sS -o /dev/null -w "mcr.microsoft.com -> HTTP %{http_code}\n" --max-time 15 https://mcr.microsoft.com/v2/ 2>&1 || echo "mcr UNREACHABLE"
          echo "=================== egress: apt archives ==================="
          curl -sS -o /dev/null -w "azure.archive.ubuntu.com -> HTTP %{http_code}\n" --max-time 15 http://azure.archive.ubuntu.com/ubuntu/ 2>&1 || echo "apt UNREACHABLE"
          echo "=================== DONE ==================="
          exit 0

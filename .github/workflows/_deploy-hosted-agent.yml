name: Deploy hosted (container-image) Foundry agent (reusable, build-once -> dev -> test)

# ---------------------------------------------------------------------------
# Reusable, SINGLE-AGENT deploy pipeline for a HOSTED (container-image) Foundry agent, called by the
# thin per-agent workflows. One run promotes ONE agent through dev then test.
#
# Build-once / promote model:
#   * build       - builds + pushes the container image to the PRIVATE ACR ONCE, tagged with the git
#                   SHA (immutable). Emits the image reference as a job output. This is the single
#                   image that moves through the environments (built once, referenced by tag).
#   * deploy-dev  - (environment: dev) patches the SAME image reference into the manifest, injects
#                   the DEV endpoint / MCP server_url, create-or-update + publish against the dev
#                   project's PRIVATE endpoint.
#   * deploy-test - (environment: test, needs: deploy-dev) references the SAME tag (no rebuild) and
#                   deploys to the test project (gated by the `test` environment's required reviewers).
#
# Teams / M365 publishing is a separate pipeline (publish-teams.yml), not part of this workflow.
#
# Posture A gate: every job runs on the in-VNet self-hosted runner (the only host that can reach the
# PRIVATE Foundry endpoints AND the private ACR). Callers are workflow_dispatch-only +
# repository-guarded. Auth is the VM managed identity via IMDS.
# ---------------------------------------------------------------------------
on:
  workflow_call:
    inputs:
      manifest-path:
        description: "Path to the agent manifest (agents/<name>/agent.yaml, definition.kind: hosted)."
        type: string
        required: true
      build-context:
        description: "Directory containing the Dockerfile + agent source."
        type: string
        required: true
      image-repository:
        description: "ACR repository name for the built image (e.g. support-case-agent)."
        type: string
        required: true
      dockerfile:
        description: "Dockerfile path RELATIVE to build-context."
        type: string
        required: false
        default: "Dockerfile"

permissions:
  contents: read

jobs:
  # --- build + push the image ONCE (immutable tag) ---------------------------------------------
  build:
    if: github.repository == 'graemefoster/locked-down-foundry-m365-agent'
    runs-on: [self-hosted, vnet, foundry-private]
    outputs:
      image-ref: ${{ steps.image.outputs.image-ref }}
    steps:
      - uses: actions/checkout@v5

      - name: Sign in with the VM managed identity
        shell: pwsh
        run: az login --identity --output none

      # Build the container image on the runner with the local Docker Engine and push it to the
      # PRIVATE ACR over its private endpoint, tagged with the git SHA (immutable, traceable). Built
      # ONCE; both envs reference the same tag.
      - name: Build and push the agent image (buildx OCI + private ACR)
        id: image
        shell: pwsh
        env:
          ACR_NAME:   ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
          CONTEXT:    ${{ inputs.build-context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          REPO:       ${{ inputs.image-repository }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ACR_NAME)) {
            throw "Repo variable AZURE_CONTAINER_REGISTRY_NAME is not set (the postprovision hook syncs it from the Bicep output; or run 'azd env refresh')."
          }
          $dockerfilePath = Join-Path $env:CONTEXT $env:DOCKERFILE
          if (-not (Test-Path $dockerfilePath)) {
            throw "Dockerfile not found at '$dockerfilePath'."
          }
          $tag = "${{ github.sha }}".Substring(0, 12)

          $loginServer = az acr show --name $env:ACR_NAME --query loginServer -o tsv
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($loginServer)) {
            throw "Could not resolve the ACR login server for '$($env:ACR_NAME)'."
          }
          $imageRef = "$loginServer/$($env:REPO):$tag"

          az acr login --name $env:ACR_NAME --output none
          if ($LASTEXITCODE -ne 0) { throw "az acr login failed for '$($env:ACR_NAME)' (is the private endpoint reachable + Docker running?)." }

          # buildx with the docker-container (BuildKit) driver + oci-mediatypes=true so the pushed
          # manifest uses OCI layer media types (Foundry's server-side image build rejects DOCKER
          # schema2 layers). See docs/known-issues.md.
          $buildxVersion = "v0.19.3"
          docker buildx version *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "buildx plugin not found - installing $buildxVersion into ~/.docker/cli-plugins."
            $pluginDir = Join-Path $env:HOME ".docker/cli-plugins"
            New-Item -ItemType Directory -Force -Path $pluginDir | Out-Null
            $pluginPath = Join-Path $pluginDir "docker-buildx"
            curl --fail --silent --show-error --location -o $pluginPath `
              "https://github.com/docker/buildx/releases/download/$buildxVersion/buildx-$buildxVersion.linux-amd64"
            if ($LASTEXITCODE -ne 0) { throw "Failed to download the buildx plugin $buildxVersion." }
            chmod 0755 $pluginPath
            docker buildx version *> $null
            if ($LASTEXITCODE -ne 0) { throw "buildx plugin still not usable after install." }
          }

          $builderName = "ocibuilder"
          docker buildx inspect $builderName *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Creating buildx builder '$builderName' (docker-container driver)."
            docker buildx create --name $builderName --driver docker-container --use
            if ($LASTEXITCODE -ne 0) { throw "docker buildx create failed for '$builderName'." }
          }
          else {
            docker buildx use $builderName
            if ($LASTEXITCODE -ne 0) { throw "docker buildx use failed for '$builderName'." }
          }

          Write-Host "Building + pushing '$imageRef' (OCI media types) from context '$($env:CONTEXT)'."
          docker buildx build `
            --builder $builderName `
            --push `
            --provenance=false `
            --output "type=image,name=$imageRef,oci-mediatypes=true" `
            --tag $imageRef `
            --file $dockerfilePath `
            $env:CONTEXT
          if ($LASTEXITCODE -ne 0) { throw "docker buildx build/push failed for '$imageRef'." }

          "image-ref=$imageRef" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Pushed image: $imageRef"

  # --- deploy to dev -----------------------------------------------------------
  deploy-dev:
    needs: build
    if: github.repository == 'graemefoster/locked-down-foundry-m365-agent'
    runs-on: [self-hosted, vnet, foundry-private]
    environment: dev
    steps:
      - uses: actions/checkout@v5

      - name: Convert agent.yaml -> agent.json + patch image + inject dev values (yq)
        env:
          MANIFEST:     ${{ inputs.manifest-path }}
          IMAGE_REF:    ${{ needs.build.outputs.image-ref }}
          VAR_ENDPOINT: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
          VAR_MCP_URL:  ${{ vars.MCP_SERVER_URL }}
        run: |
          if ! command -v yq >/dev/null 2>&1; then
            echo "::error::yq is required to convert the manifest but was not found on the runner. Re-run 'azd provision' so cloud-init installs it."
            exit 1
          fi
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::Manifest not found: $MANIFEST"
            exit 1
          fi
          yq -o=json '.' "$MANIFEST" > agent.json
          name="$(yq -r '.name' "$MANIFEST")"
          if [ -z "$name" ] || [ "$name" = "null" ]; then
            echo "::error::Manifest '$MANIFEST' has no 'name'."
            exit 1
          fi
          IMAGE_REF="$IMAGE_REF" yq -i -o=json '.definition.image = strenv(IMAGE_REF)' agent.json
          echo "Patched definition.image = $IMAGE_REF"
          if grep -q '{{FOUNDRY_PROJECT_ENDPOINT}}' agent.json; then
            if [ -z "$VAR_ENDPOINT" ]; then
              echo "::error::Manifest references {{FOUNDRY_PROJECT_ENDPOINT}} but the dev environment variable AZURE_AI_PROJECT_ENDPOINT is not set."
              exit 1
            fi
            tmp="$(mktemp)"
            sed "s#{{FOUNDRY_PROJECT_ENDPOINT}}#${VAR_ENDPOINT}#g" agent.json > "$tmp" && mv "$tmp" agent.json
            echo "Injected dev FOUNDRY_PROJECT_ENDPOINT: $VAR_ENDPOINT"
          fi
          if grep -q '"type": "mcp"' agent.json; then
            if [ -z "$VAR_MCP_URL" ]; then
              echo "::error::The manifest has an MCP tool but the dev environment variable MCP_SERVER_URL is not set."
              exit 1
            fi
            MCP_URL="$VAR_MCP_URL" yq -i -o=json '(.definition.tools[] | select(.type == "mcp")).server_url = strenv(MCP_URL)' agent.json
            echo "Injected dev MCP server_url: $VAR_MCP_URL"
          fi
          echo "Prepared agent '$name':"
          cat agent.json

      - name: Resolve dev Foundry endpoint
        id: cfg
        shell: pwsh
        env:
          VAR_ENDPOINT: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
        run: |
          $endpoint = $env:VAR_ENDPOINT
          if ([string]::IsNullOrWhiteSpace($endpoint)) {
            throw "The dev environment variable AZURE_AI_PROJECT_ENDPOINT is not set (the postprovision hook syncs it from AZURE_AI_PROJECT_ENDPOINT_DEV; or run 'azd env refresh')."
          }
          "endpoint=$endpoint" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create or update agent (dev)
        id: create
        uses: ./.github/actions/create-agent
        with:
          agent-json: agent.json
          foundry-endpoint: ${{ steps.cfg.outputs.endpoint }}

      - name: Publish agent version (dev)
        uses: ./.github/actions/publish-agent
        with:
          agent-name: ${{ steps.create.outputs.agent-name }}
          agent-version: ${{ steps.create.outputs.agent-version }}
          foundry-endpoint: ${{ steps.cfg.outputs.endpoint }}

  # --- promote to test (same image tag, gated by the `test` environment's required reviewers) ---
  deploy-test:
    needs: [build, deploy-dev]
    if: github.repository == 'graemefoster/locked-down-foundry-m365-agent'
    runs-on: [self-hosted, vnet, foundry-private]
    environment: test
    steps:
      - uses: actions/checkout@v5

      - name: Convert agent.yaml -> agent.json + patch image + inject test values (yq)
        env:
          MANIFEST:     ${{ inputs.manifest-path }}
          IMAGE_REF:    ${{ needs.build.outputs.image-ref }}
          VAR_ENDPOINT: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
          VAR_MCP_URL:  ${{ vars.MCP_SERVER_URL }}
        run: |
          if ! command -v yq >/dev/null 2>&1; then
            echo "::error::yq is required to convert the manifest but was not found on the runner. Re-run 'azd provision' so cloud-init installs it."
            exit 1
          fi
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::Manifest not found: $MANIFEST"
            exit 1
          fi
          yq -o=json '.' "$MANIFEST" > agent.json
          name="$(yq -r '.name' "$MANIFEST")"
          if [ -z "$name" ] || [ "$name" = "null" ]; then
            echo "::error::Manifest '$MANIFEST' has no 'name'."
            exit 1
          fi
          IMAGE_REF="$IMAGE_REF" yq -i -o=json '.definition.image = strenv(IMAGE_REF)' agent.json
          echo "Patched definition.image = $IMAGE_REF"
          if grep -q '{{FOUNDRY_PROJECT_ENDPOINT}}' agent.json; then
            if [ -z "$VAR_ENDPOINT" ]; then
              echo "::error::Manifest references {{FOUNDRY_PROJECT_ENDPOINT}} but the test environment variable AZURE_AI_PROJECT_ENDPOINT is not set."
              exit 1
            fi
            tmp="$(mktemp)"
            sed "s#{{FOUNDRY_PROJECT_ENDPOINT}}#${VAR_ENDPOINT}#g" agent.json > "$tmp" && mv "$tmp" agent.json
            echo "Injected test FOUNDRY_PROJECT_ENDPOINT: $VAR_ENDPOINT"
          fi
          if grep -q '"type": "mcp"' agent.json; then
            if [ -z "$VAR_MCP_URL" ]; then
              echo "::error::The manifest has an MCP tool but the test environment variable MCP_SERVER_URL is not set."
              exit 1
            fi
            MCP_URL="$VAR_MCP_URL" yq -i -o=json '(.definition.tools[] | select(.type == "mcp")).server_url = strenv(MCP_URL)' agent.json
            echo "Injected test MCP server_url: $VAR_MCP_URL"
          fi
          echo "Prepared agent '$name':"
          cat agent.json

      - name: Resolve test Foundry endpoint
        id: cfg
        shell: pwsh
        env:
          VAR_ENDPOINT: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
        run: |
          $endpoint = $env:VAR_ENDPOINT
          if ([string]::IsNullOrWhiteSpace($endpoint)) {
            throw "The test environment variable AZURE_AI_PROJECT_ENDPOINT is not set (the postprovision hook syncs it from AZURE_AI_PROJECT_ENDPOINT_TEST; or run 'azd env refresh')."
          }
          "endpoint=$endpoint" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create or update agent (test)
        id: create
        uses: ./.github/actions/create-agent
        with:
          agent-json: agent.json
          foundry-endpoint: ${{ steps.cfg.outputs.endpoint }}

      - name: Publish agent version (test)
        uses: ./.github/actions/publish-agent
        with:
          agent-name: ${{ steps.create.outputs.agent-name }}
          agent-version: ${{ steps.create.outputs.agent-version }}
          foundry-endpoint: ${{ steps.cfg.outputs.endpoint }}

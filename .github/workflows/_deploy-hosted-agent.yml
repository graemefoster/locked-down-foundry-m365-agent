name: "Internal: Deploy container-image agent"

on:
  workflow_call:
    inputs:
      agent-directory:
        description: Directory containing the image agent's agent.yaml.
        type: string
        required: true
      source-directory:
        description: Docker build context relative to the agent directory.
        type: string
        required: false
        default: ''
      image-repository:
        description: ACR repository name. Defaults to the agent name.
        type: string
        required: false
        default: ''
      dockerfile:
        description: Dockerfile path relative to the build context.
        type: string
        required: false
        default: Dockerfile

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'graemefoster/locked-down-foundry-m365-agent'
    runs-on: [self-hosted, vnet, foundry-private]
    steps:
      - uses: actions/checkout@v5

      - name: Sign in with the VM managed identity
        shell: pwsh
        run: az login --identity --output none

      - name: Build and deploy the image agent
        shell: pwsh
        run: |
          ./scripts/deploy-agent.ps1 `
            -AgentDirectory "${{ inputs.agent-directory }}" `
            -SourceDirectory "${{ inputs.source-directory }}" `
            -FoundryProjectEndpoint "${{ vars.AZURE_AI_PROJECT_ENDPOINT }}" `
            -AcrName "${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}" `
            -ImageRepository "${{ inputs.image-repository }}" `
            -Dockerfile "${{ inputs.dockerfile }}"

name: Deploy container-image agent

on:
  workflow_call:
    inputs:
      agent-manifest:
        description: Path to the image agent YAML manifest (agents/<name>/agent.yaml).
        type: string
        required: true
      build-context:
        description: Docker build context.
        type: string
        required: true
      image-repository:
        description: ACR repository name.
        type: string
        required: true
      dockerfile:
        description: Dockerfile path relative to the build context.
        type: string
        required: false
        default: Dockerfile

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'graemefoster/locked-down-foundry-m365-agent'
    runs-on: [self-hosted, vnet, foundry-private]
    steps:
      - uses: actions/checkout@v5

      - name: Normalize the manifest (yq)
        shell: bash
        run: yq -o=json '.' "${{ inputs.agent-manifest }}" > agent.json

      - name: Sign in with the VM managed identity
        shell: pwsh
        run: az login --identity --output none

      - name: Build, deploy, and publish the image agent
        shell: pwsh
        run: |
          ./scripts/deploy-image-agent.ps1 `
            -AgentJsonPath agent.json `
            -FoundryProjectEndpoint "${{ vars.AZURE_AI_PROJECT_ENDPOINT }}" `
            -AcrName "${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}" `
            -ImageRepository "${{ inputs.image-repository }}" `
            -BuildContext "${{ inputs.build-context }}" `
            -Dockerfile "${{ inputs.dockerfile }}"

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Chat — support-case-agent</title>
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("scoutTheme");
        const theme =
          param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
    <script src="https://unpkg.com/marked@12.0.2/marked.min.js"></script>
    <script src="https://unpkg.com/dompurify@3.1.6/dist/purify.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        --cp-bg: #f7f4ef;
        --cp-bg-elevated: #fcfbf8;
        --cp-surface: #ffffff;
        --cp-surface-soft: #f5f5f5;
        --cp-border: #dedede;
        --cp-border-strong: #919191;
        --cp-text: #242424;
        --cp-text-muted: #5c5c5c;
        --cp-text-soft: #6f6f6f;
        --cp-accent: #b11f4b;
        --cp-accent-hover: #9a1a41;
        --cp-accent-soft: rgba(177, 31, 75, 0.08);
        --cp-accent-fg: #ffffff;
        --cp-success: #16a34a;
        --cp-danger: #dc2626;
        --cp-warning: #f59e0b;
        --cp-link: #0078d4;
        --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        --cp-bg: #3d3b3a;
        --cp-bg-elevated: #343231;
        --cp-surface: #292929;
        --cp-surface-soft: #2e2e2e;
        --cp-border: #474747;
        --cp-border-strong: #5f5f5f;
        --cp-text: #dedede;
        --cp-text-muted: #919191;
        --cp-text-soft: #b0b0b0;
        --cp-accent: #fd8ea1;
        --cp-accent-hover: #fb7b91;
        --cp-accent-soft: rgba(253, 142, 161, 0.14);
        --cp-accent-fg: #1a1a1a;
        --cp-success: #4ade80;
        --cp-danger: #f87171;
        --cp-warning: #fbbf24;
        --cp-link: #4da6ff;
        --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      }

      * { box-sizing: border-box; }
      html, body, #root { height: 100%; }
      body {
        margin: 0;
        background: var(--cp-bg);
        color: var(--cp-text);
        font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button { font-family: inherit; cursor: pointer; }
      .btn {
        border-radius: 0.625rem;
        border: 1px solid var(--cp-border);
        background: var(--cp-surface);
        color: var(--cp-text);
        padding: 0.5rem 0.9rem;
        font-size: 0.88rem;
        font-weight: 600;
      }
      .btn:hover { background: var(--cp-surface-soft); }
      .btn-primary { background: var(--cp-accent); color: var(--cp-accent-fg); border-color: var(--cp-accent); }
      .btn-primary:hover { background: var(--cp-accent-hover); border-color: var(--cp-accent-hover); }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .icon-btn {
        border: 1px solid var(--cp-border);
        background: var(--cp-surface);
        color: var(--cp-text);
        border-radius: 0.625rem;
        width: 38px; height: 38px;
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 1.05rem;
      }
      .icon-btn:hover { background: var(--cp-surface-soft); }
      input, textarea {
        font-family: inherit;
        width: 100%;
        border-radius: 0.625rem;
        border: 1px solid var(--cp-border);
        background: var(--cp-surface);
        color: var(--cp-text);
        padding: 0.55rem 0.7rem;
        font-size: 0.92rem;
      }
      textarea { resize: none; }
      input:focus, textarea:focus { outline: 2px solid var(--cp-accent); border-color: var(--cp-accent); }
      .msg-content p { margin: 0 0 0.5rem; }
      .msg-content p:last-child { margin-bottom: 0; }
      .md :first-child { margin-top: 0; }
      .md :last-child { margin-bottom: 0; }
      .md p { margin: 0 0 0.6rem; line-height: 1.55; }
      .md h1, .md h2, .md h3, .md h4 { margin: 1rem 0 0.5rem; line-height: 1.3; }
      .md h1 { font-size: 1.3rem; }
      .md h2 { font-size: 1.15rem; }
      .md h3 { font-size: 1.02rem; }
      .md ul, .md ol { margin: 0 0 0.6rem; padding-left: 1.4rem; }
      .md li { margin: 0.15rem 0; }
      .md a { color: var(--cp-link); }
      .md code {
        font-family: Consolas, "Courier New", Courier, monospace;
        font-size: 0.86em;
        background: var(--cp-surface-soft);
        border: 1px solid var(--cp-border);
        border-radius: 5px;
        padding: 0.08em 0.35em;
      }
      .md pre {
        background: var(--cp-surface-soft);
        border: 1px solid var(--cp-border);
        border-radius: 10px;
        padding: 0.75rem 0.9rem;
        overflow-x: auto;
        margin: 0 0 0.6rem;
      }
      .md pre code { background: none; border: none; padding: 0; font-size: 0.85rem; }
      .md blockquote {
        margin: 0 0 0.6rem;
        padding: 0.2rem 0.9rem;
        border-left: 3px solid var(--cp-border-strong);
        color: var(--cp-text-muted);
      }
      .md table { border-collapse: collapse; margin: 0 0 0.6rem; font-size: 0.9rem; }
      .md th, .md td { border: 1px solid var(--cp-border); padding: 0.35rem 0.6rem; text-align: left; }
      .md th { background: var(--cp-surface-soft); }
      .md hr { border: none; border-top: 1px solid var(--cp-border); margin: 0.8rem 0; }
      .spin { animation: spin 0.9s linear infinite; display: inline-block; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .dot { animation: blink 1.2s infinite; }
      @keyframes blink { 0%,100%{opacity:.2} 50%{opacity:1} }
      .pulse { animation: pulse 1.1s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{opacity:.35; transform:scale(.85)} 50%{opacity:1; transform:scale(1.15)} }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" data-presets="react">
      const { useState, useEffect, useRef, useCallback } = React;
      const LS_CFG = "agentchat-config-v1";

      if (window.marked) {
        marked.setOptions({ breaks: true, gfm: true });
      }
      function renderMarkdown(text) {
        try {
          const html = window.marked ? marked.parse(text || "") : (text || "");
          return window.DOMPurify ? DOMPurify.sanitize(html) : html;
        } catch {
          return text || "";
        }
      }

      function useConfig() {
        const [cfg, setCfg] = useState(null);
        useEffect(() => {
          const saved = (() => {
            try { return JSON.parse(localStorage.getItem(LS_CFG)); } catch { return null; }
          })();
          if (saved) { setCfg(saved); return; }
          fetch("/api/config")
            .then((r) => r.json())
            .then((d) => setCfg(d))
            .catch(() => setCfg({ baseUrl: "", agentName: "", agentId: "", username: "" }));
        }, []);
        const save = (next) => {
          setCfg(next);
          localStorage.setItem(LS_CFG, JSON.stringify(next));
        };
        return [cfg, save];
      }

      // Parse an OpenAI-responses SSE stream, invoking onDelta(text) as tokens arrive.
      async function streamMessage({ cfg, conversation, input, onDelta, signal }) {
        const resp = await fetch("/api/message", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ...cfg, conversation, input }),
          signal,
        });
        if (!resp.ok || !resp.body) {
          const t = await resp.text();
          throw new Error(`message failed (HTTP ${resp.status}): ${t}`);
        }
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let fullText = "";
        const handleEvent = (raw) => {
          const dataLines = raw
            .split("\n")
            .filter((l) => l.startsWith("data:"))
            .map((l) => l.slice(5).trim());
          if (!dataLines.length) return;
          const dataStr = dataLines.join("\n");
          if (dataStr === "[DONE]") return;
          let obj;
          try { obj = JSON.parse(dataStr); } catch { return; }
          const type = obj.type || "";
          if (type === "response.output_text.delta" && typeof obj.delta === "string") {
            fullText += obj.delta;
            onDelta(obj.delta);
          } else if (typeof obj.delta === "string" && type.endsWith(".delta")) {
            fullText += obj.delta;
            onDelta(obj.delta);
          } else if (type === "response.completed" && !fullText && obj.response) {
            // Fallback: pull final text if no deltas were streamed.
            const out = (obj.response.output || [])
              .flatMap((o) => o.content || [])
              .filter((c) => c.type === "output_text" && c.text)
              .map((c) => c.text)
              .join("");
            if (out) { fullText = out; onDelta(out); }
          } else if (type === "error" || obj.error) {
            throw new Error(obj.error?.message || obj.message || "stream error");
          }
        };
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buffer.indexOf("\n\n")) !== -1) {
            const chunk = buffer.slice(0, idx);
            buffer = buffer.slice(idx + 2);
            handleEvent(chunk);
          }
        }
        if (buffer.trim()) handleEvent(buffer);
        return fullText;
      }

      function Avatar({ role }) {
        const isUser = role === "user";
        return (
          <div style={{
            width: 30, height: 30, borderRadius: "50%", flexShrink: 0,
            display: "flex", alignItems: "center", justifyContent: "center",
            fontWeight: 800, fontSize: "0.72rem",
            background: isUser ? "var(--cp-surface-soft)" : "var(--cp-accent-soft)",
            color: isUser ? "var(--cp-text-muted)" : "var(--cp-accent)",
          }}>{isUser ? "You" : "AI"}</div>
        );
      }

      function Message({ m, onImgLoad }) {
        const isUser = m.role === "user";
        return (
          <div style={{ display: "flex", gap: 12, padding: "0.85rem 0" }}>
            <Avatar role={m.role} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontWeight: 700, fontSize: "0.82rem", marginBottom: 4 }}>
                {isUser ? "You" : "support-case-agent"}
              </div>
              {m.images && m.images.length > 0 && (
                <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: m.text ? 8 : 0 }}>
                  {m.images.map((src, i) => (
                    <img key={i} src={src} alt="pasted" onLoad={onImgLoad}
                      style={{ maxWidth: 260, maxHeight: 200, borderRadius: 10, border: "1px solid var(--cp-border)" }} />
                  ))}
                </div>
              )}
              <div className="msg-content" style={{ lineHeight: 1.5, fontSize: "0.95rem" }}>
                {isUser ? (
                  <span style={{ whiteSpace: "pre-wrap" }}>{m.text}</span>
                ) : (
                  <span className="md" dangerouslySetInnerHTML={{ __html: renderMarkdown(m.text) }} />
                )}
                {m.streaming && <span className="dot"> ▍</span>}
              </div>
            </div>
          </div>
        );
      }

      function SettingsPanel({ cfg, onSave, onClose, onNewConversation }) {
        const [draft, setDraft] = useState(cfg);
        const field = (key, label, ph) => (
          <div style={{ marginBottom: 12 }}>
            <label style={{ fontSize: "0.8rem", fontWeight: 600, display: "block", marginBottom: 4 }}>{label}</label>
            <input value={draft[key] || ""} placeholder={ph || ""}
              onChange={(e) => setDraft({ ...draft, [key]: e.target.value })} />
          </div>
        );
        return (
          <div style={{
            position: "fixed", inset: 0, background: "rgba(0,0,0,0.45)", zIndex: 50,
            display: "flex", justifyContent: "flex-end",
          }} onMouseDown={onClose}>
            <div onMouseDown={(e) => e.stopPropagation()} style={{
              width: 420, maxWidth: "92vw", height: "100%", overflowY: "auto",
              background: "var(--cp-surface)", borderLeft: "1px solid var(--cp-border)", padding: "1.5rem",
            }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
                <h3 style={{ margin: 0 }}>Settings</h3>
                <button className="icon-btn" onClick={onClose}>✕</button>
              </div>
              {field("baseUrl", "Foundry project base URL", "https://<acct>.services.ai.azure.com/api/projects/<project>")}
              {field("agentName", "Agent name (path)", "support-case-agent")}
              {field("agentId", "agent_ids (identity GUID)")}
              {field("username", "username")}
              {field("appUrl", "App URL (\"Open app\" button)", "http://localhost:8080")}
              <hr style={{ margin: "16px 0", border: "none", borderTop: "1px solid var(--cp-border)" }} />
              <div style={{ fontSize: "0.8rem", fontWeight: 700, marginBottom: 10, color: "var(--cp-text-muted)" }}>🎙 Voice Live (WebRTC)</div>
              <div style={{ fontSize: "0.8rem", color: "var(--cp-text-muted)", marginBottom: 12, lineHeight: 1.5 }}>
                Voice plays the hosted agent's replies aloud: the agent (below) answers over the
                Responses API, and its streamed text is spoken by the raw realtime voice as a
                text-to-speech narrator.
              </div>
              {field("projectId", "project_id", "projectebym")}
              {field("voiceModel", "Realtime TTS voice model", "gpt-realtime")}
              <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                <button className="btn btn-primary" onClick={() => { onSave(draft); onClose(); }}>Save</button>
                <button className="btn" onClick={onClose}>Cancel</button>
              </div>
              <hr style={{ margin: "20px 0", border: "none", borderTop: "1px solid var(--cp-border)" }} />
              <button className="btn" onClick={() => { onNewConversation(); onClose(); }}>Start new conversation</button>
              <p style={{ fontSize: "0.78rem", color: "var(--cp-text-muted)", marginTop: 10 }}>
                The proxy authenticates with <code>az account get-access-token --resource https://ai.azure.com</code>.
                Make sure you are <code>az login</code>-ed.
              </p>
            </div>
          </div>
        );
      }

      function App() {
        const [cfg, saveCfg] = useConfig();
        const [messages, setMessages] = useState([]);
        const [text, setText] = useState("");
        const [attachments, setAttachments] = useState([]); // [{id, dataUrl}]
        const [conversation, setConversation] = useState(null);
        const [busy, setBusy] = useState(false);
        const [error, setError] = useState(null);
        const [showSettings, setShowSettings] = useState(false);
        const [shareStream, setShareStream] = useState(null);
        const [voiceState, setVoiceState] = useState("idle"); // idle | connecting | live | error
        const [voiceLog, setVoiceLog] = useState([]); // diagnostic event trail
        const scrollRef = useRef(null);
        const fileRef = useRef(null);
        const videoRef = useRef(null);
        const textareaRef = useRef(null);
        const pcRef = useRef(null);
        const dcRef = useRef(null);
        const esRef = useRef(null);
        const callIdRef = useRef(null);
        const micRef = useRef(null);
        const audioCtxRef = useRef(null);
        const remoteAudioRef = useRef(null);
        const voiceAsstOpenRef = useRef(false);
        // --- TTS pipeline (hybrid voice) ---------------------------------
        // The hosted agent (Responses API) is always the brain. When voice is
        // live we run a SEPARATE, raw Voice Live session as a pure text-to-speech
        // voice: the agent's streamed reply is chunked into sentences and each
        // sentence is spoken verbatim. These refs drive a serialized speak queue
        // (one Voice Live response at a time; the next chunk is sent on
        // response.done).
        const ttsQueueRef = useRef([]);
        const ttsBusyRef = useRef(false);
        const ttsBufferRef = useRef("");
        const ttsSpokenRef = useRef("");
        const ttsDoneHandledRef = useRef(true);
        const ttsPumpRef = useRef(() => {});

        const scrollToBottom = useCallback(() => {
          const el = scrollRef.current;
          if (el) el.scrollTop = el.scrollHeight;
        }, []);

        useEffect(() => {
          const el = textareaRef.current;
          if (!el) return;
          el.style.height = "auto";
          el.style.height = Math.min(el.scrollHeight, 200) + "px";
        }, [text]);

        useEffect(() => {
          scrollToBottom();
        }, [messages, scrollToBottom]);

        const openApp = useCallback(() => {
          const u = (cfg && cfg.appUrl) || "http://localhost:8080";
          const w = Math.min(1280, Math.round(window.screen.availWidth * 0.6));
          const h = Math.min(900, Math.round(window.screen.availHeight * 0.85));
          const left = Math.round((window.screen.availWidth - w) / 2);
          const top = Math.round((window.screen.availHeight - h) / 2);
          const features = `popup=yes,noopener,width=${w},height=${h},left=${left},top=${top}`;
          window.open(u, "graeapp", features);
        }, [cfg]);

        // --- Voice Live (WebRTC) ------------------------------------------
        // Browser owns the RTCPeerConnection (mic in, agent audio out, plus the
        // `voice-live-events` data channel for transcripts). Only the SDP
        // handshake is proxied so the local server can attach the Entra token.
        const vlog = useCallback((dir, msg) => {
          const line = new Date().toLocaleTimeString() + " " + dir + " " + msg;
          console.log("[voice]", dir, msg);
          setVoiceLog((l) => [...l.slice(-40), line]);
        }, []);
        const appendVoiceTranscript = useCallback((delta) => {
          setMessages((m) => {
            const copy = m.slice();
            if (voiceAsstOpenRef.current && copy.length && copy[copy.length - 1].role === "assistant" && copy[copy.length - 1].voice) {
              copy[copy.length - 1] = { ...copy[copy.length - 1], text: copy[copy.length - 1].text + delta };
            } else {
              copy.push({ role: "assistant", text: delta, voice: true });
              voiceAsstOpenRef.current = true;
            }
            return copy;
          });
        }, []);

        const onVoiceEvent = useCallback((raw, src) => {
          // The upstream WS bridge (SSE, src="ws") is the source of truth. The
          // WebRTC data channel (src="dc") mirrors the same control events, so
          // ignoring it prevents every transcript/response event being handled
          // twice (which showed up as doubled text).
          if (src === "dc") return;
          let ev;
          try { ev = JSON.parse(raw); } catch { return; }
          const t = ev.type || "";
          let detail = "";
          if (t === "response.done" || t === "response.created") {
            const r = ev.response || {};
            detail = " [status=" + (r.status || "?") +
              (r.status_details ? " " + JSON.stringify(r.status_details) : "") +
              ", output=" + (Array.isArray(r.output) ? r.output.length : 0) + "]";
          } else if (t.startsWith("response.output_item") || t.startsWith("response.content_part")) {
            detail = " " + JSON.stringify(ev.item || ev.part || {}).slice(0, 200);
          }
          vlog("<-" + (src ? "(" + src + ")" : ""), t + (ev.error ? " ERROR: " + (ev.error.message || JSON.stringify(ev.error)) : "") + detail);
          // NOTE: we deliberately do NOT render the TTS session's own transcript
          // into the chat — the hosted agent's real reply is already shown from
          // the Responses stream. The Voice Live session here is only a speaker.
          // We DO accumulate the spoken transcript into the voice log so we can
          // confirm it read verbatim (vs refusing / rewriting).
          if ((t === "response.audio_transcript.delta" || t === "response.output_audio_transcript.delta") && typeof ev.delta === "string") {
            ttsSpokenRef.current += ev.delta;
          } else if (t === "response.audio_transcript.done" || t === "response.output_audio_transcript.done" || t === "response.done") {
            voiceAsstOpenRef.current = false;
            if (ttsSpokenRef.current) { vlog("spoke", JSON.stringify(ttsSpokenRef.current.slice(0, 120))); ttsSpokenRef.current = ""; }
            // The raw Voice Live session may end a spoken response with
            // response.audio_transcript.done and NOT response.done — advance the
            // speak queue on whichever terminal event fires first, once only.
            if (!ttsDoneHandledRef.current) { ttsDoneHandledRef.current = true; ttsBusyRef.current = false; ttsPumpRef.current(); }
          } else if (t === "bridge.ws.closed") {
            // The upstream signalling WS dropped — stop the SSE from reconnecting.
            try { if (esRef.current) esRef.current.close(); } catch {}
            esRef.current = null;
            setError("Voice control channel closed by server (code " + (ev.code ?? "?") + (ev.reason ? ", " + ev.reason : "") + ").");
          } else if (t === "bridge.ws.error") {
            setError("Voice control channel error: " + (ev.message || "unknown"));
          } else if (t === "error" || ev.error) {
            setError("Voice: " + (ev.error?.message || ev.message || "stream error"));
          }
        }, [vlog]);

        const stopVoice = useCallback(async (callId) => {
          const pc = pcRef.current;
          const id = callId || (pc && pc._callId) || callIdRef.current;
          try { if (esRef.current) esRef.current.close(); } catch {}
          esRef.current = null;
          callIdRef.current = null;
          try { if (pc) pc.close(); } catch {}
          pcRef.current = null;
          if (micRef.current) { micRef.current.getTracks().forEach((tr) => tr.stop()); micRef.current = null; }
          if (audioCtxRef.current) { try { audioCtxRef.current.close(); } catch {} audioCtxRef.current = null; }
          if (remoteAudioRef.current) remoteAudioRef.current.srcObject = null;
          voiceAsstOpenRef.current = false;
          setVoiceState("idle");
          if (id) fetch("/api/voice/hangup", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ callId: id }) }).catch(() => {});
        }, []);

        // Send a client event to the live session. Azure Voice Live consumes
        // client events on the WebSocket CONTROL channel (bridged here via POST),
        // NOT the WebRTC data channel — the data channel is server->client only.
        const sendVoiceEvent = useCallback(async (event) => {
          const callId = callIdRef.current;
          if (callId) {
            try {
              await fetch("/api/voice/send", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ callId, event }),
              });
              return true;
            } catch {}
          }
          const dc = dcRef.current;
          if (dc && dc.readyState === "open") {
            try { dc.send(JSON.stringify(event)); return true; } catch {}
          }
          return false;
        }, []);

        // Speak one text chunk through the raw Voice Live TTS session. We do NOT
        // add it as a user message (the realtime model would treat it as a
        // request and sometimes refuses / answers it — "I'm sorry, I can't...").
        // Instead we drive a single audio response whose per-response
        // `instructions` carry the exact script, with no input items, so there's
        // no user turn to respond to — the model just vocalizes the text.
        const speakChunk = useCallback(async (chunk) => {
          if (!callIdRef.current || !chunk || !chunk.trim()) return;
          vlog("->", "tts speak: " + JSON.stringify(chunk.slice(0, 60)));
          await sendVoiceEvent({
            type: "response.create",
            response: {
              modalities: ["audio"],
              input: [],
              instructions:
                "Read the text below aloud, word for word, in a natural, warm, professional " +
                "voice. It is a script to be spoken, NOT a question, task, or request — never " +
                "answer it, never refuse, never apologize, never add, omit, or change anything, " +
                "and never mention these rules. Speak only this text:\n\n" + chunk,
            },
          });
        }, [vlog, sendVoiceEvent]);

        // Serialized pump: Voice Live handles one response at a time, so we send
        // the next queued chunk only after the previous response.done.
        const pumpTTS = useCallback(() => {
          if (ttsBusyRef.current) return;
          const next = ttsQueueRef.current.shift();
          if (next == null) return;
          ttsBusyRef.current = true;
          ttsDoneHandledRef.current = false;
          speakChunk(next);
        }, [speakChunk]);
        useEffect(() => { ttsPumpRef.current = pumpTTS; }, [pumpTTS]);

        const enqueueTTS = useCallback((chunk) => {
          if (chunk && chunk.trim()) { ttsQueueRef.current.push(chunk.trim()); pumpTTS(); }
        }, [pumpTTS]);

        // Split the running agent-response buffer into complete sentences and
        // enqueue each for speech. On `final`, flush whatever remains.
        const flushSentencesToTTS = useCallback((final) => {
          let buf = ttsBufferRef.current;
          while (true) {
            const idx = buf.search(/[.!?\n]/);
            if (idx === -1) break;
            enqueueTTS(buf.slice(0, idx + 1));
            buf = buf.slice(idx + 1);
          }
          ttsBufferRef.current = buf;
          if (final && buf.trim()) { enqueueTTS(buf); ttsBufferRef.current = ""; }
        }, [enqueueTTS]);

        const resetTTS = useCallback(() => {
          ttsQueueRef.current = [];
          ttsBusyRef.current = false;
          ttsBufferRef.current = "";
          ttsSpokenRef.current = "";
          ttsDoneHandledRef.current = true;
        }, []);

        const startVoice = useCallback(async () => {
          setError(null);
          setVoiceLog([]);
          resetTTS();
          setVoiceState("connecting");
          try {
            const pc = new RTCPeerConnection();
            pcRef.current = pc;
            // We never open the real microphone. But Voice Live is a real-time
            // *call* and tears down a session with no media flow, so we feed it a
            // synthetic SILENT audio track (WebAudio oscillator at zero gain).
            // This keeps RTP flowing (session stays alive) without sending voice.
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            audioCtxRef.current = ctx;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            gain.gain.value = 0; // silence
            const dst = ctx.createMediaStreamDestination();
            osc.connect(gain).connect(dst);
            osc.start();
            const silentStream = dst.stream;
            micRef.current = silentStream;
            silentStream.getAudioTracks().forEach((tr) => pc.addTrack(tr, silentStream));
            vlog("info", "silent audio track added (keepalive)");
            pc.ontrack = (e) => {
              if (remoteAudioRef.current) {
                remoteAudioRef.current.srcObject = e.streams[0];
                remoteAudioRef.current.play().catch(() => {});
              }
            };
            // English voice, manual turns (no VAD, since there's no mic input).
            // This session is a pure TTS narrator: `instructions` tell the raw
            // realtime model to read the user item verbatim rather than answer it.
            const session = {
              modalities: ["text", "audio"],
              voice: { type: "azure-standard", name: "en-US-Ava:DragonHDLatestNeural" },
              turn_detection: null,
              instructions:
                "You are a text-to-speech voice. Read the user's message aloud exactly as written, " +
                "in a natural, warm, professional tone. Do NOT answer questions, do NOT add, remove, " +
                "summarize, translate or comment on anything — only speak the provided text verbatim.",
            };
            const dc = pc.createDataChannel("voice-live-events");
            dcRef.current = dc;
            // The data channel is a fallback path; the primary control channel is
            // the upstream WebSocket the server holds (bridged via SSE + POST).
            dc.onopen = () => vlog("info", "data channel open");
            dc.onmessage = (e) => onVoiceEvent(typeof e.data === "string" ? e.data : "", "dc");
            pc.onconnectionstatechange = () => {
              vlog("info", "pc " + pc.connectionState);
              if (["failed", "disconnected", "closed"].includes(pc.connectionState) && pcRef.current === pc) {
                stopVoice();
              }
            };
            pc.oniceconnectionstatechange = () => vlog("info", "ice " + pc.iceConnectionState);

            const offer = await pc.createOffer({ offerToReceiveAudio: true });
            await pc.setLocalDescription(offer);
            await new Promise((resolve) => {
              if (pc.iceGatheringState === "complete") return resolve();
              const check = () => {
                if (pc.iceGatheringState === "complete") { pc.removeEventListener("icegatheringstatechange", check); resolve(); }
              };
              pc.addEventListener("icegatheringstatechange", check);
              setTimeout(resolve, 3000); // fall back to whatever candidates we have
            });

            const resp = await fetch("/api/voice/connect", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                sdp: pc.localDescription.sdp,
                baseUrl: cfg.baseUrl,
                agentName: cfg.agentName,
                agentId: cfg.agentId,
                projectId: cfg.projectId,
                model: cfg.voiceModel,
                useAgent: false,
                session,
              }),
            });
            const data = await resp.json().catch(() => ({}));
            if (!resp.ok || !data.sdp_answer) {
              throw new Error(data.error || `voice connect failed (HTTP ${resp.status})`);
            }
            pc._callId = data.callId;
            callIdRef.current = data.callId;
            await pc.setRemoteDescription({ type: "answer", sdp: data.sdp_answer });

            // Open the server-sent-events stream that relays the upstream WS's
            // control events (session.updated, response.*, transcripts, errors).
            const es = new EventSource("/api/voice/events?callId=" + encodeURIComponent(data.callId));
            esRef.current = es;
            es.onmessage = (e) => onVoiceEvent(e.data, "ws");
            es.onerror = () => vlog("info", "event stream error/closed");

            setVoiceState("live");
            // Configure the session over the control channel (WS bridge).
            vlog("->", "session.update (voice=" + session.voice.name + ", turn_detection=null)");
            await sendVoiceEvent({ type: "session.update", session });
          } catch (e) {
            setError("Voice failed: " + (e.message || e));
            setVoiceState("error");
            await stopVoice();
          }
        }, [cfg, onVoiceEvent, stopVoice, vlog, sendVoiceEvent, resetTTS]);

        const startShare = useCallback(async () => {
          setError(null);
          try {
            const stream = await navigator.mediaDevices.getDisplayMedia({
              video: { frameRate: 5 },
              audio: false,
            });
            setShareStream(stream);
            const v = videoRef.current;
            if (v) {
              v.srcObject = stream;
              await v.play().catch(() => {});
            }
            stream.getVideoTracks()[0].addEventListener("ended", () => {
              setShareStream(null);
              if (videoRef.current) videoRef.current.srcObject = null;
            });
          } catch (e) {
            setError("Screen share was cancelled or failed: " + (e.message || e));
          }
        }, []);

        const stopShare = useCallback(() => {
          if (shareStream) shareStream.getTracks().forEach((t) => t.stop());
          setShareStream(null);
          if (videoRef.current) videoRef.current.srcObject = null;
        }, [shareStream]);

        function capture() {
          const v = videoRef.current;
          if (!shareStream || !v || !v.videoWidth) {
            setError('Click "Share for capture" first, then pick the app tab/window.');
            return;
          }
          const c = document.createElement("canvas");
          c.width = v.videoWidth;
          c.height = v.videoHeight;
          c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
          const dataUrl = c.toDataURL("image/png");
          const caption = text.trim();
          if (caption) setText("");
          send({ text: caption, images: [dataUrl] });
        }

        const addImages = useCallback((files) => {
          const imgs = Array.from(files).filter((f) => f.type.startsWith("image/"));
          imgs.forEach((file) => {
            const reader = new FileReader();
            reader.onload = () => {
              setAttachments((a) => [...a, { id: Math.random().toString(36).slice(2), dataUrl: reader.result }]);
            };
            reader.readAsDataURL(file);
          });
        }, []);

        const onPaste = useCallback((e) => {
          const items = e.clipboardData?.items || [];
          const files = [];
          for (const it of items) if (it.kind === "file" && it.type.startsWith("image/")) {
            const f = it.getAsFile();
            if (f) files.push(f);
          }
          if (files.length) { e.preventDefault(); addImages(files); }
        }, [addImages]);

        async function ensureConversation() {
          if (conversation) return conversation;
          const r = await fetch("/api/conversation", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ...cfg, topic: "New chat" }),
          });
          const data = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(`create conversation failed (HTTP ${r.status}): ${JSON.stringify(data)}`);
          const id = data.conversation || data.id || data.conversation_id;
          if (!id) throw new Error("no conversation id in response: " + JSON.stringify(data));
          setConversation(id);
          return id;
        }

        async function send(override) {
          if (busy) return;
          const trimmed = override && typeof override.text === "string" ? override.text.trim() : text.trim();
          const imgs = override && override.images ? override.images : attachments.map((a) => a.dataUrl);
          if (!trimmed && imgs.length === 0) return;
          setError(null);
          const userMsg = { role: "user", text: trimmed, images: imgs };

          // The hosted agent (Responses API) is always the brain. When a Voice
          // Live TTS session is live we ALSO pipe the agent's streamed reply,
          // sentence by sentence, into it so the answer is spoken aloud.
          const speakLive = voiceState === "live" && !!callIdRef.current;
          if (speakLive) { ttsBufferRef.current = ""; }

          const content = [];
          if (trimmed) content.push({ type: "input_text", text: trimmed });
          imgs.forEach((src) => content.push({ type: "input_image", image_url: src }));
          const input = [{ type: "message", role: "user", content }];

          setMessages((m) => [...m, userMsg, { role: "assistant", text: "", streaming: true }]);
          if (!override) {
            setText("");
            setAttachments([]);
          }
          setBusy(true);
          try {
            const conv = await ensureConversation();
            await streamMessage({
              cfg,
              conversation: conv,
              input,
              onDelta: (d) => {
                setMessages((m) => {
                  const copy = m.slice();
                  const last = copy[copy.length - 1];
                  copy[copy.length - 1] = { ...last, text: last.text + d };
                  return copy;
                });
                if (speakLive) {
                  ttsBufferRef.current += d;
                  flushSentencesToTTS(false);
                }
              },
            });
            if (speakLive) flushSentencesToTTS(true);
          } catch (e) {
            setError(String(e.message || e));
          } finally {
            setBusy(false);
            setMessages((m) => {
              const copy = m.slice();
              const last = copy[copy.length - 1];
              if (last && last.role === "assistant") copy[copy.length - 1] = { ...last, streaming: false };
              return copy;
            });
          }
        }

        function onKeyDown(e) {
          if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
        }

        function newConversation() {
          setConversation(null);
          setMessages([]);
          setError(null);
        }

        if (!cfg) {
          return <div style={{ padding: 40, color: "var(--cp-text-muted)" }}>Loading…</div>;
        }

        return (
          <div style={{ height: "100%", display: "flex", flexDirection: "column", maxWidth: 820, margin: "0 auto" }}>
            <header style={{
              display: "flex", alignItems: "center", justifyContent: "space-between",
              padding: "0.8rem 1rem", borderBottom: "1px solid var(--cp-border)", background: "var(--cp-bg-elevated)",
            }}>
              <div>
                <div style={{ fontWeight: 800, fontSize: "1.05rem" }}>Agent Chat</div>
                <div style={{ fontSize: "0.76rem", color: "var(--cp-text-muted)" }}>
                  {cfg.agentName}{conversation ? ` · ${conversation.slice(0, 18)}…` : " · no conversation yet"}
                </div>
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <button className="btn" onClick={newConversation}>New chat</button>
                <button className="icon-btn" title="Settings" onClick={() => setShowSettings(true)}>⚙</button>
              </div>
            </header>

            <div ref={scrollRef} style={{ flex: 1, overflowY: "auto", padding: "0.5rem 1rem" }}>
              {messages.length === 0 && (
                <div style={{ color: "var(--cp-text-muted)", padding: "2rem 0", textAlign: "center" }}>
                  <p>Start chatting with <strong>{cfg.agentName}</strong>.</p>
                  <p style={{ fontSize: "0.85rem" }}>Paste screenshots directly into the box, or use the image button.</p>
                </div>
              )}
              {messages.map((m, i) => <Message key={i} m={m} onImgLoad={scrollToBottom} />)}
            </div>

            {error && (
              <div style={{
                margin: "0 1rem 0.5rem", padding: "0.6rem 0.8rem", borderRadius: 10,
                background: "rgba(220,38,38,0.1)", color: "var(--cp-danger)", fontSize: "0.85rem",
                border: "1px solid var(--cp-danger)", whiteSpace: "pre-wrap", wordBreak: "break-word",
              }}>{error}</div>
            )}

            {voiceState !== "idle" && voiceLog.length > 0 && (
              <details style={{ margin: "0 1rem 0.5rem" }}>
                <summary style={{ cursor: "pointer", fontSize: "0.8rem", color: "var(--cp-text-muted)" }}>
                  voice event log ({voiceLog.length})
                </summary>
                <div style={{
                  marginTop: 6, padding: "0.5rem 0.7rem", borderRadius: 10, maxHeight: 160, overflowY: "auto",
                  background: "var(--cp-surface-soft)", border: "1px solid var(--cp-border)",
                  fontFamily: "Consolas, monospace", fontSize: "0.72rem", whiteSpace: "pre-wrap", wordBreak: "break-word",
                }}>{voiceLog.join("\n")}</div>
              </details>
            )}

            <div style={{
              display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap",
              padding: "0.5rem 1rem 0", fontSize: "0.85rem",
            }}>
              <button className="btn" onClick={openApp}>🗔 Open app</button>
              {voiceState === "idle" || voiceState === "error" ? (
                <button className="btn" onClick={startVoice}>🔊 Voice</button>
              ) : voiceState === "connecting" ? (
                <button className="btn" disabled><span className="spin">◠</span> connecting…</button>
              ) : (
                <>
                  <button className="btn btn-primary" onClick={() => stopVoice()}>⏹ End voice</button>
                  <span style={{ display: "inline-flex", alignItems: "center", gap: 5, color: "var(--cp-accent)", fontWeight: 700 }}>
                    <span className="pulse" style={{ width: 9, height: 9, borderRadius: "50%", background: "var(--cp-accent)" }} /> voice on · replies spoken
                  </span>
                </>
              )}
              {!shareStream ? (
                <button className="btn" onClick={startShare}>🖥 Share for capture</button>
              ) : (
                <>
                  <button className="btn btn-primary" onClick={capture}>📸 Capture screenshot</button>
                  <span style={{ display: "inline-flex", alignItems: "center", gap: 5, color: "var(--cp-success)", fontWeight: 700 }}>
                    <span style={{ width: 9, height: 9, borderRadius: "50%", background: "var(--cp-success)" }} /> sharing
                  </span>
                  <button className="btn" onClick={stopShare}>Stop</button>
                </>
              )}
              <span style={{ color: "var(--cp-text-muted)" }}>
                {shareStream ? "Capture sends the screenshot as a message." : "Share the app window once, then capture screenshots straight into the chat."}
              </span>
            </div>

            {attachments.length > 0 && (
              <div style={{
                display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center",
                margin: "0.5rem 1rem 0", padding: "0.5rem 0.6rem",
                border: "1px solid var(--cp-border)", borderRadius: 12, background: "var(--cp-surface-soft)",
              }}>
                {attachments.map((a) => (
                  <div key={a.id} style={{ position: "relative" }}>
                    <img src={a.dataUrl} alt="attach"
                      style={{ width: 56, height: 56, objectFit: "cover", borderRadius: 8, border: "1px solid var(--cp-border)", display: "block" }} />
                    <button onClick={() => setAttachments((x) => x.filter((y) => y.id !== a.id))}
                      style={{
                        position: "absolute", top: -7, right: -7, width: 20, height: 20, borderRadius: "50%",
                        border: "1px solid var(--cp-surface)", background: "var(--cp-danger)", color: "#fff",
                        fontSize: "0.7rem", lineHeight: 1, display: "flex", alignItems: "center", justifyContent: "center",
                      }}>✕</button>
                  </div>
                ))}
              </div>
            )}

            <div style={{ display: "flex", gap: 8, alignItems: "flex-end", padding: "0.6rem 1rem 1rem" }}>
              <input ref={fileRef} type="file" accept="image/*" multiple style={{ display: "none" }}
                onChange={(e) => { addImages(e.target.files); e.target.value = ""; }} />
              <button className="icon-btn" title="Attach image" onClick={() => fileRef.current?.click()}>🖼</button>
              <textarea
                ref={textareaRef}
                rows={1}
                value={text}
                placeholder="Message the agent…  (paste a screenshot, Enter to send, Shift+Enter for newline)"
                onChange={(e) => setText(e.target.value)}
                onKeyDown={onKeyDown}
                onPaste={onPaste}
                style={{ minHeight: 42, maxHeight: 200, overflowY: "auto" }}
              />
              <button className="btn btn-primary" disabled={busy || (!text.trim() && attachments.length === 0)} onClick={() => send()}>
                {busy ? <span className="spin">◠</span> : "Send"}
              </button>
            </div>

            {showSettings && (
              <SettingsPanel
                cfg={cfg}
                onSave={saveCfg}
                onClose={() => setShowSettings(false)}
                onNewConversation={newConversation}
              />
            )}

            <video ref={videoRef} muted playsInline style={{ display: "none" }} />
            <audio ref={remoteAudioRef} autoPlay style={{ display: "none" }} />
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>

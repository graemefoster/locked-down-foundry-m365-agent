# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: locked-down-foundry-m365-agent

infra:
  provider: bicep
  path: infra
  module: main

hooks:
  preprovision:
    shell: pwsh
    run: ./hooks/preprovision.ps1
    continueOnError: false
    interactive: true
  # After provision, azd runs ONE narrow host-side step: postprovision pushes the Bicep outputs
  # that the workflows consume into GitHub Actions repo variables (via `gh variable set`) so the
  # deploy workflows "just work". That is the ONLY post-provision automation. Agent deploys, MCP
  # compliance and Teams / M365 publishing are still done ONLY by the in-VNet self-hosted GitHub
  # Actions workflows (the per-agent .github/workflows/deploy-*-agent.yml + reusable
  # deploy-agent.yml, and deploy-compliancy.yml), which run natively on the private VM runner -
  # no `az vm run-command` orchestration from the azd host.
  postprovision:
    shell: pwsh
    run: ./hooks/postprovision.ps1
    continueOnError: true
    interactive: false
  predown:
    shell: pwsh
    run: ./hooks/predown.ps1
    continueOnError: false
    interactive: false
